<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lewys Budget Hôtel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend+Zetta:wght@500;600&display=swap">
<style>
/* Layout: dark brand band on top, then parameters → KPI strip → monthly grid (sticky label column) → chart. Inputs read as electrik blue, results as ink. */
:root{
  --electrik:#3721CA; --gold:#B28958; --gold-light:#D9B68E; --lavender:#ADB7F9; --ink:#1D1D1B; --graphite:#2E2E30;
  --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F0F0F4; --fg:#1D1D1B; --muted:#6B6A73; --line:#E3E2E9;
  --input-bg:#F1F0FD; --input-fg:#3721CA; --input-line:#D6D2F7; --accent:#3721CA; --accent-fg:#FFFFFF;
  --band:#1D1D1B; --band-fg:#FFFFFF; --band-muted:rgba(255,255,255,.62);
  --good:#1E7F4F; --good-bg:#E3F3EA; --bad:#B4362F; --bad-bg:#FBE7E5; --neutral-bg:#EEEEF2;
  --n1:#B9B7C4; --focus:#3721CA;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-label:"Lexend Zetta","Plus Jakarta Sans",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C1F; --surface-2:#242428; --fg:#F1F0F5; --muted:#A3A1AE; --line:#323238;
  --input-bg:#221E45; --input-fg:#C4CBFF; --input-line:#3A3470; --accent:#7D6CF2; --accent-fg:#FFFFFF;
  --band:#0E0E10; --good:#5CCB92; --good-bg:#16301F; --bad:#F08A82; --bad-bg:#3A1A18; --neutral-bg:#2A2A30;
  --n1:#55535F; --focus:#ADB7F9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C1F; --surface-2:#242428; --fg:#F1F0F5; --muted:#A3A1AE; --line:#323238;
  --input-bg:#221E45; --input-fg:#C4CBFF; --input-line:#3A3470; --accent:#7D6CF2; --accent-fg:#FFFFFF;
  --band:#0E0E10; --good:#5CCB92; --good-bg:#16301F; --bad:#F08A82; --bad-bg:#3A1A18; --neutral-bg:#2A2A30;
  --n1:#55535F; --focus:#ADB7F9; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-family:var(--font-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* Band */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.logo{height:30px;width:auto;flex:none}
.app-name{display:flex;flex-direction:column;gap:1px;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
.app-name b{font-weight:700;font-size:15px}
.app-name span{font-family:var(--font-label);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-light)}
.band .spacer{flex:1}
.band select{background:#2E2E30;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:7px 10px;max-width:280px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--electrik);border-color:var(--electrik);color:#fff}
.btn.primary:hover{background:#2A18A8}
.btn.ghost-dark{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.btn.ghost-dark:hover{border-color:var(--gold-light)}
.btn.danger{color:var(--bad)}
.btn svg{width:15px;height:15px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:250px;z-index:30;display:grid;gap:2px}
.menu-pop button{display:grid;grid-template-columns:44px 1fr;align-items:center;text-align:left;gap:8px;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop .ext{font-family:var(--font-label);font-size:9px;letter-spacing:.06em;background:var(--input-bg);color:var(--input-fg);border-radius:5px;padding:4px 0;text-align:center}
.menu-pop small{display:block;color:var(--muted);font-size:12px}
.sync{font-size:12px;color:var(--band-muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--gold-light);display:inline-block}
.sync.ok i{background:#5CCB92}

main{display:grid;gap:22px;padding-block:22px 48px}
main>*{min-width:0}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title-row h1{margin:4px 0 0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.title-row h1 em{font-style:normal;color:var(--gold)}
.status{display:inline-flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--neutral-bg);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.gold{background:color-mix(in srgb,var(--gold-light) 30%,transparent);color:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px;font-weight:700}
.panel-b{padding:16px 18px}

/* Parameters */
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.field input.inp,.field select.inp{background:var(--input-bg);border-color:var(--input-line);color:var(--input-fg);font-weight:600}
.field.wide{grid-column:span 2}
@media (max-width:520px){.field.wide{grid-column:auto}}
.hint{font-size:11.5px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-size:clamp(18px,2vw,24px);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .n1{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.lead{background:var(--electrik);color:#fff}
.kpi.lead .eyebrow,.kpi.lead .n1{color:rgba(255,255,255,.75)}
.kpi.lead .chip{background:rgba(255,255,255,.16);color:#fff}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Quick adjust */
.adjust{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.adjust .field{width:150px}
.adjust .sep{width:1px;align-self:stretch;background:var(--line)}

/* Grid */
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1280px;font-size:13px}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.grid thead th{position:sticky;top:0;background:var(--surface-2);font-weight:700;padding:9px 8px;font-size:12px;z-index:2}
.grid thead th .yr{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grid .lbl{position:sticky;left:0;background:var(--surface);text-align:left;padding:7px 12px;font-weight:600;z-index:1;min-width:230px;border-right:1px solid var(--line)}
.grid thead .lbl{z-index:3;background:var(--surface-2)}
.grid .lbl small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grid td.o{padding:7px 8px}
.grid td.tot,.grid th.tot{background:var(--surface-2);font-weight:700;padding:7px 10px;border-left:1px solid var(--line)}
.grid tr.sect td{background:var(--bg);padding:12px 12px 6px;text-align:left;border-bottom:1px solid var(--line)}
.grid tr.sect td .eyebrow{color:var(--gold)}
.grid tr.sect td.lbl{background:var(--bg)}
.grid tr.strong td{font-weight:700}
.grid tr.strong .lbl{color:var(--fg)}
.grid tr.key td.o,.grid tr.key td.lbl{background:color-mix(in srgb,var(--electrik) 6%,var(--surface))}
.grid tr.key td.tot{background:color-mix(in srgb,var(--electrik) 12%,var(--surface-2))}
.grid input.cell{width:100%;min-width:72px;border:0;border-radius:0;background:var(--input-bg);color:var(--input-fg);font-weight:600;text-align:right;padding:7px 8px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px transparent}
.grid input.cell:hover{box-shadow:inset 0 0 0 1px var(--input-line)}
.grid input.cell:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus);background:var(--surface)}
.grid input.cell.auto{font-weight:500;font-style:italic;opacity:.8}
.grid input.cell.n1{background:var(--surface-2);color:var(--fg)}
.grid td.in{padding:0;border-left:1px solid var(--surface)}
.grid textarea.cmt{width:100%;min-width:110px;height:46px;border:0;background:transparent;padding:6px 8px;font-size:12px;resize:vertical;text-align:left;white-space:normal}
.grid textarea.cmt:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* Chart */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:640px;height:auto}

.notes textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}

/* Overlay */
.modal-bg{position:fixed;inset:0;background:rgba(14,14,16,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:440px;width:100%;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h3{margin:0;font-size:17px}
.modal p{margin:0;color:var(--muted)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.empty{text-align:center;padding:60px 20px;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0}
.foot{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:720px){.app-name{display:none}.band select{max-width:170px}.band{position:static}}
@media (prefers-reduced-motion:no-preference){.btn,.grid input.cell{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>

</head>

(() => {
'use strict';
/* ---------- Constants ---------- */
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MSHORT = ['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const STATUSES = {draft:'Brouillon', review:'En revue', ok:'Validé'};
const LS_KEY = 'lewys-budgets-v1';
const SESSION = Math.random().toString(36).slice(2,10);
const LOGO_SVG = document.querySelector('.logo').outerHTML.replace('class="logo"','xmlns="http://www.w3.org/2000/svg" width="311" height="99"');

/* Example template built from the Hôtel Hemen workbook (Sept → Août). */
const HEMEN_N1 = {
  sold:[56,43,39,48,43,42,47,59,42,64,65,77],
  heb:[31716.51,17796.71,13895.72,17797.80,15844.79,15623.45,15936.82,36729.13,27278.50,44004.58,47307.17,60954.65],
  tot:[39987.09,24424.64,20482.24,26066.57,22392.77,24774.85,22405.00,47206.90,39260.32,59291.03,66243.87,79429.55]
};
function exampleBudget(variant){
  const v8 = variant === 8;
  const to = v8 ? [.7,.5,.35,.4,.3,.4,.4,.65,.6,.8,.85,.95] : [.75,.6,.5,.6,.6,.6,.6,.75,.65,.85,.9,.95];
  const pm = v8 ? [380,300,280,300,280,300,280,350,380,450,550,600] : [550,400,350,350,350,350,350,600,600,650,700,800];
  return normalize({
    id: uid(), hotel:'Hôtel Hemen', scenario: v8 ? '8 chambres' : '3 chambres',
    rooms: v8 ? 8 : 3, roomsN1: 3, startYear: 2026, startMonth: 8, extrasCoef: v8 ? .6 : 1,
    status:'draft', author:'', notes: v8 ? 'Scénario extension à 8 chambres : extras/nuitée ramenés à 60 % du réalisé N-1.' : 'Scénario base 3 chambres.',
    months: to.map((t,i)=>({to:t, pm:pm[i], extras:null, closed:0, comment:'', n1:{sold:HEMEN_N1.sold[i], heb:HEMEN_N1.heb[i], tot:HEMEN_N1.tot[i]}}))
  });
}
function blankBudget(){
  const now = new Date();
  return normalize({id:uid(), hotel:'Nouvel établissement', scenario:'Base', rooms:20, roomsN1:20, startYear:now.getFullYear()+1, startMonth:0, extrasCoef:1, status:'draft', author:'', notes:'',
    months: Array.from({length:12},()=>({to:.65, pm:120, extras:null, closed:0, comment:'', n1:{sold:0, heb:0, tot:0}}))});
}
function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function normalize(b){
  const n = (x,d=0)=> (typeof x==='number' && isFinite(x)) ? x : d;
  const out = {
    id: String(b.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'').slice(0,60) || uid(),
    hotel: String(b.hotel||'Établissement').slice(0,120), scenario: String(b.scenario||'').slice(0,80),
    rooms: Math.max(0,n(b.rooms,1)), roomsN1: Math.max(0,n(b.roomsN1,n(b.rooms,1))),
    startYear: Math.round(n(b.startYear,new Date().getFullYear())), startMonth: Math.min(11,Math.max(0,Math.round(n(b.startMonth,0)))),
    extrasCoef: n(b.extrasCoef,1), status: STATUSES[b.status]?b.status:'draft', author:String(b.author||'').slice(0,80), notes:String(b.notes||'').slice(0,4000),
    updatedAt: n(b.updatedAt, Date.now()), lastEditor: b.lastEditor||'',
    months: []
  };
  for (let i=0;i<12;i++){
    const m = (b.months||[])[i]||{}; const n1 = m.n1||{};
    out.months.push({to:n(m.to,0), pm:n(m.pm,0), extras:(typeof m.extras==='number'&&isFinite(m.extras))?m.extras:null, closed:Math.max(0,n(m.closed,0)), comment:String(m.comment||'').slice(0,500),
      n1:{sold:n(n1.sold,0), heb:n(n1.heb,0), tot:n(n1.tot,0)}});
  }
  return out;
}

/* ---------- Calculation engine ---------- */
const daysIn = (y,m)=> new Date(y,m+1,0).getDate();
const div = (a,b)=> b ? a/b : 0;
function periodOf(b){ return Array.from({length:12},(_,i)=>{ const k=b.startMonth+i; return {y:b.startYear+Math.floor(k/12), m:k%12}; }); }
function compute(b){
  const per = periodOf(b);
  const rows = per.map((p,i)=>{
    const M = b.months[i];
    const days = daysIn(p.y,p.m), daysN1 = daysIn(p.y-1,p.m);
    const avail = Math.max(0,days-M.closed)*b.rooms;
    const availN1 = daysN1*b.roomsN1;
    const toN1 = div(M.n1.sold,availN1), pmN1 = div(M.n1.heb,M.n1.sold), extN1 = div(M.n1.tot-M.n1.heb,M.n1.sold);
    const extrasAuto = extN1*b.extrasCoef;
    const extras = M.extras==null ? extrasAuto : M.extras;
    const nights = avail*M.to, heb = nights*M.pm, ext = nights*extras, tot = heb+ext;
    return {p, days, daysN1, closed:M.closed, avail, to:M.to, pm:M.pm, extras, extrasAuto, nights, heb, ext, tot,
      revpar:div(heb,avail), trevpar:div(tot,avail),
      availN1, soldN1:M.n1.sold, hebN1:M.n1.heb, totN1:M.n1.tot, toN1, pmN1, extN1, revparN1:div(M.n1.heb,availN1), trevparN1:div(M.n1.tot,availN1)};
  });
  const s = k => rows.reduce((a,r)=>a+r[k],0);
  const T = {days:s('days'), avail:s('avail'), nights:s('nights'), heb:s('heb'), ext:s('ext'), tot:s('tot'), closed:s('closed'),
    availN1:s('availN1'), soldN1:s('soldN1'), hebN1:s('hebN1'), totN1:s('totN1')};
  Object.assign(T,{to:div(T.nights,T.avail), pm:div(T.heb,T.nights), extras:div(T.ext,T.nights), revpar:div(T.heb,T.avail), trevpar:div(T.tot,T.avail),
    toN1:div(T.soldN1,T.availN1), pmN1:div(T.hebN1,T.soldN1), extN1:div(T.totN1-T.hebN1,T.soldN1), revparN1:div(T.hebN1,T.availN1), trevparN1:div(T.totN1,T.availN1)});
  rows.forEach(r=>r.share = div(r.tot,T.tot));
  return {rows,T};
}
const pct = (a,b)=> b ? a/b-1 : null;

/* ---------- Formatting ---------- */
const nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const clean = s => s.replace(/[  ]/g,' ');
const F = {
  eur: v => clean(nf0.format(Math.round(v||0))) + ' €',
  eur2: v => clean(nf2.format(v||0)) + ' €',
  int: v => clean(nf0.format(Math.round(v||0))),
  dec: v => clean(nf1.format(v||0)),
  pct: v => clean(nf1.format((v||0)*100)) + ' %',
  var: v => v==null||!isFinite(v) ? '—' : (v>0?'+':'') + clean(nf1.format(v*100)) + ' %',
  pts: v => (v>0?'+':'') + clean(nf1.format(v*100)) + ' pts',
  eurVar: v => (v>0?'+':'') + clean(nf0.format(Math.round(v||0))) + ' €',
  k: v => Math.abs(v)>=1e6 ? clean(nf1.format(v/1e6))+' M€' : Math.abs(v)>=1e3 ? clean(nf0.format(v/1e3))+' k€' : clean(nf0.format(v))+' €'
};
function parseNum(s){
  if (s==null) return NaN; s = String(s).trim().replace(/[\s  €]/g,'');
  s = s.replace(/%|pts?$/g,'');
  if (/,\d+$/.test(s) && s.includes('.')) s = s.replace(/\./g,'');
  s = s.replace(',', '.');
  return parseFloat(s);
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const periodLabel = b => { const p=periodOf(b); return `${MSHORT[p[0].m]} ${p[0].y} – ${MSHORT[p[11].m]} ${p[11].y}`; };
const exerciseLabel = b => b.startMonth===0 ? String(b.startYear) : `${b.startYear}-${b.startYear+1}`;

/* ---------- Store (shared db on claude.ai, browser storage elsewhere) ---------- */
const state = {budgets:new Map(), currentId:null, mode:'local', db:null, loaded:false};
const writeQ = new Map(); // id -> {timer, inflight, dirty}
function setSync(text, ok){ const el=document.getElementById('sync'); el.className='sync'+(ok?' ok':''); el.lastElementChild.textContent=text; }
function lsRead(){ try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({current:state.currentId, budgets:[...state.budgets.values()]})); return true; }catch(e){ return false; } }
function rememberCurrent(){ try{ localStorage.setItem(LS_KEY+'-current', state.currentId||''); }catch(e){} }
function recallCurrent(){ try{ return localStorage.getItem(LS_KEY+'-current'); }catch(e){ return null; } }

function persist(b, immediate){
  b.updatedAt = Date.now(); b.lastEditor = SESSION;
  if (state.mode==='local'){ setSync(lsWrite() ? 'Enregistré sur ce navigateur' : 'Non enregistré (stockage bloqué) : exportez en JSON', true); return; }
  let q = writeQ.get(b.id); if(!q){ q={timer:null,inflight:false,dirty:false}; writeQ.set(b.id,q); }
  q.dirty = true; clearTimeout(q.timer);
  setSync('Modifications en attente…');
  q.timer = setTimeout(()=>flush(b.id), immediate?0:700);
}
async function flush(id){
  const q = writeQ.get(id); if(!q||q.inflight||!q.dirty) return;
  const b = state.budgets.get(id); if(!b){ q.dirty=false; return; }
  q.inflight = true; q.dirty = false;
  try{ await state.db.collection('budgets').doc(id).set(JSON.parse(JSON.stringify(b))); setSync('Enregistré · partagé', true); }
  catch(e){
    if (e&&e.code==='unavailable'){ q.dirty=true; setTimeout(()=>flush(id), 800+Math.random()*800); }
    else if (e&&e.code==='quota_exceeded') toast('Espace de stockage plein : supprimez d’anciens budgets.');
    else setSync('Échec de l’enregistrement : exportez en JSON par sécurité');
  }
  finally{ q.inflight=false; if(q.dirty) flush(id); }
}
async function removeBudget(id){
  state.budgets.delete(id);
  if (state.mode==='db'){ try{ await state.db.collection('budgets').doc(id).delete(); }catch(e){ toast('Suppression impossible pour le moment.'); } }
  else lsWrite();
}
function addBudget(b){ state.budgets.set(b.id,b); state.currentId=b.id; rememberCurrent(); persist(b,true); renderAll(); }

async function initStore(){
  let db = null;
  try{ if (window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); }catch(e){ db=null; }
  if (db){
    state.mode='db'; state.db=db;
    const timer = setTimeout(()=>{ if(!state.loaded){ setSync('Données injoignables pour le moment'); } },10000);
    db.collection('budgets').onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(timer);
      let changedCurrent = false;
      snap.docChanges().forEach(ch=>{
        const id = ch.doc.id;
        if (ch.type==='removed'){ state.budgets.delete(id); if(id===state.currentId) changedCurrent=true; return; }
        const remote = normalize({...ch.doc.data(), id});
        const local = state.budgets.get(id);
        if (local && remote.lastEditor===SESSION) return;   // echo of our own write
        if (local && remote.updatedAt <= local.updatedAt) return;
        state.budgets.set(id, remote); if(id===state.currentId) changedCurrent=true;
      });
      const first = !state.loaded; state.loaded = true;
      if (!snap.metadata.fromCache) setSync('Synchronisé · partagé', true);
      if (first || changedCurrent || !state.budgets.has(state.currentId)) { pickCurrent(); renderAll(); }
      else renderSelect();
    }, err=>{ clearTimeout(timer); setSync('Synchronisation interrompue'); });
  } else {
    state.mode='local';
    const saved = lsRead();
    if (saved && Array.isArray(saved.budgets) && saved.budgets.length){ saved.budgets.forEach(b=>{ const nb=normalize(b); state.budgets.set(nb.id,nb); }); state.currentId = saved.current; }
    else { const a=exampleBudget(3), c=exampleBudget(8); state.budgets.set(a.id,a); state.budgets.set(c.id,c); state.currentId=a.id; lsWrite(); }
    state.loaded = true; setSync('Enregistré sur ce navigateur', true);
    pickCurrent(); renderAll();
  }
}
function pickCurrent(){
  if (state.currentId && state.budgets.has(state.currentId)) return;
  const want = recallCurrent();
  if (want && state.budgets.has(want)) { state.currentId=want; return; }
  const list = sortedBudgets(); state.currentId = list.length ? list[0].id : null;
}
const sortedBudgets = () => [...state.budgets.values()].sort((a,b)=> (a.hotel+a.scenario).localeCompare(b.hotel+b.scenario,'fr'));
const cur = () => state.budgets.get(state.currentId);

}

];
function derive(r){
  return {dHeb:r.heb-r.hebN1, dHebP:pct(r.heb,r.hebN1), dTot:r.tot-r.totN1, dTotP:pct(r.tot,r.totN1), dTo:r.to-r.toN1, dPm:pct(r.pm,r.pmN1), dRev:pct(r.revpar,r.revparN1)};
}
function inputVal(b,i,key){
  const M=b.months[i];
  switch(key){
    case 'to': return F.dec(M.to*100).replace(/,0$/,'') + ' %';
    case 'pm': return F.int(M.pm);
    case 'extras': return M.extras==null ? '' : F.dec(M.extras).replace(/,0$/,'');
    case 'closed': return M.closed ? String(M.closed) : '0';
    case 'n1.sold': return F.int(M.n1.sold);
    case 'n1.heb': return F.int(M.n1.heb);
    case 'n1.tot': return F.int(M.n1.tot);
  }
}
function gridRows(b){
  let html=''; let rowIdx=0;
  ROWS.forEach(R=>{
    if (R.sect){ html += `<tr class="sect"><td class="lbl"><span class="eyebrow">${R.sect}</span></td><td colspan="13"></td></tr>`; return; }
    const cls = [R.strong?'strong':'', R.key?'key':''].join(' ');
    html += `<tr class="${cls}"><td class="lbl">${R.l}${R.sub?`<small>${R.sub}</small>`:''}</td>`;
    for (let i=0;i<12;i++){
      if (R.comment) html += `<td class="in"><textarea class="cmt" data-i="${i}" data-c="1" aria-label="Commentaire ${MONTHS[periodOf(b)[i].m]}">${esc(b.months[i].comment)}</textarea></td>`;
      else if (R.input) html += `<td class="in"><input class="cell${R.input.startsWith('n1')?' n1':''}" data-i="${i}" data-k="${R.input}" data-r="${rowIdx}" inputmode="decimal" aria-label="${esc(R.l)} ${MONTHS[periodOf(b)[i].m]}" value="${inputVal(b,i,R.input)}"></td>`;
      else html += `<td class="o num" id="o-${R.k}-${i}"></td>`;
    }
    html += R.comment ? `<td class="tot"></td></tr>` : `<td class="tot num" id="o-${R.k}-T"></td></tr>`;
    if (R.input) rowIdx++;
  });
  return html;
}
function setCell(id, text, signVal){
  const el = document.getElementById(id); if(!el) return;
  el.textContent = text;
  if (signVal!==undefined){ el.classList.toggle('pos', signVal>0.00001); el.classList.toggle('neg', signVal<-0.00001); }
}
function refresh(){
  const b = cur(); if(!b) return;
  const {rows,T} = compute(b);
  const Td = derive(T);
  rows.forEach((r,i)=>{
    const d = derive(r);
    ROWS.forEach(R=>{
      if (R.sect||R.comment) return;
      if (R.input){
        if (R.input==='extras'){ const el=document.querySelector(`input[data-k="extras"][data-i="${i}"]`); if(el){ el.placeholder = F.dec(r.extrasAuto); el.classList.toggle('auto', b.months[i].extras==null); } }
        return;
      }
      const v = R.k in d ? d[R.k] : r[R.k];
      setCell(`o-${R.k}-${i}`, F[R.f](v), R.sign? v : undefined);
    });
  });
  ROWS.forEach(R=>{
    if (R.sect||R.comment) return;
    const v = R.k in Td ? Td[R.k] : (R.k==='share'?1:T[R.k]);
    setCell(`o-${R.k}-T`, F[R.f](v), R.sign? v : undefined);
  });
  renderKpis(T,Td); renderChart(rows);
  const chip = document.getElementById('statusChip'); if(chip){ chip.textContent=STATUSES[b.status]; chip.className='chip '+(b.status==='ok'?'good':b.status==='review'?'gold':''); }
}
function varChip(v, pts){
  if (v==null||!isFinite(v)) return '<span class="chip">n.d.</span>';
  const c = v>0.0005?'good':v<-0.0005?'bad':'';
  return `<span class="chip ${c}">${pts?F.pts(v):F.var(v)}</span>`;
}
function renderKpis(T,Td){
  const el = document.getElementById('kpis'); if(!el) return;
  const k = (lead,label,val,n1txt,chip)=>`<div class="kpi${lead?' lead':''}"><span class="eyebrow">${label}</span><span class="v num">${val}</span><span class="n1 num">${n1txt}${chip}</span></div>`;
  el.innerHTML =
    k(1,'CA total',F.eur(T.tot),'N-1 '+F.k(T.totN1),varChip(Td.dTotP)) +
    k(0,'CA hébergement',F.eur(T.heb),'N-1 '+F.k(T.hebN1),varChip(Td.dHebP)) +
    k(0,"Taux d'occupation",F.pct(T.to),'N-1 '+F.pct(T.toN1),varChip(Td.dTo,true)) +
    k(0,'Prix moyen',F.eur(T.pm),'N-1 '+F.eur(T.pmN1),varChip(Td.dPm)) +
    k(0,'RevPAR',F.eur2(T.revpar),'N-1 '+F.eur2(T.revparN1),varChip(Td.dRev)) +
    k(0,'Nuitées',F.int(T.nights),'N-1 '+F.int(T.soldN1),varChip(pct(T.nights,T.soldN1)));
}

/* ---------- Chart (SVG, colors passed in so PDF export can reuse it) ---------- */
function chartColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  return {bar:g('--accent'), n1:g('--n1'), to:g('--gold'), toN1:g('--lavender'), text:g('--muted'), grid:g('--line'), fg:g('--fg')};
}
function chartSVG(rows, C){
  const W=960,H=340,ml=64,mr=56,mt=18,mb=44, iw=W-ml-mr, ih=H-mt-mb;
  const maxV = Math.max(1,...rows.map(r=>Math.max(r.tot,r.totN1)));
  const step = niceStep(maxV/4); const top = Math.ceil(maxV/step)*step;
  const y = v => mt + ih - (v/top)*ih;
  const yt = v => mt + ih - Math.min(1,v)*ih;
  const bw = iw/12, gw = bw*0.62, b1 = gw/2;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" role="img" aria-label="CA mensuel budget et N-1, taux d'occupation">`;
  for (let v=0; v<=top+1e-6; v+=step){ s += `<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="${C.grid}" stroke-width="1"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${C.text}">${esc(F.k(v))}</text>`; }
  [0,.25,.5,.75,1].forEach(t=>{ s += `<text x="${W-mr+8}" y="${yt(t)+4}" font-size="11" fill="${C.text}">${t*100} %</text>`; });
  rows.forEach((r,i)=>{
    const x0 = ml + i*bw + (bw-gw)/2;
    s += `<rect x="${x0}" y="${y(r.totN1)}" width="${b1-2}" height="${Math.max(0,mt+ih-y(r.totN1))}" rx="2" fill="${C.n1}"><title>${MONTHS[r.p.m]} N-1 : ${F.eur(r.totN1)}</title></rect>`;
    s += `<rect x="${x0+b1}" y="${y(r.tot)}" width="${b1-2}" height="${Math.max(0,mt+ih-y(r.tot))}" rx="2" fill="${C.bar}"><title>${MONTHS[r.p.m]} budget : ${F.eur(r.tot)}</title></rect>`;
    s += `<text x="${ml+i*bw+bw/2}" y="${H-mb+18}" text-anchor="middle" font-size="11.5" fill="${C.text}">${MSHORT[r.p.m]}</text>`;
    if (i===0||r.p.m===0) s += `<text x="${ml+i*bw+bw/2}" y="${H-mb+33}" text-anchor="middle" font-size="10" fill="${C.text}">${r.p.y}</text>`;
  });
  const line = (k,col,dash) => { const pts=rows.map((r,i)=>`${ml+i*bw+bw/2},${yt(r[k])}`); return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>` + rows.map((r,i)=>`<circle cx="${ml+i*bw+bw/2}" cy="${yt(r[k])}" r="3.5" fill="${col}"><title>${MONTHS[r.p.m]} ${k==='to'?'TO budget':'TO N-1'} : ${F.pct(r[k])}</title></circle>`).join(''); };
  s += line('toN1',C.toN1,true) + line('to',C.to,false);
  s += `<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="${C.text}" stroke-width="1"/>`;
  return s + '</svg>';
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const n=x/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function renderChart(rows){ const el=document.getElementById('chart'); if(el) el.innerHTML = chartSVG(rows, chartColors()); }

/* ---------- Editing ---------- */
function setMonthValue(b,i,key,raw){
  const M = b.months[i]; let v = parseNum(raw);
  if (key==='extras'){ M.extras = (String(raw).trim()==='' || !isFinite(v)) ? null : Math.max(0,v); return; }
  if (!isFinite(v)) v = 0;
  if (key==='to'){ const frac = String(raw).includes('%') ? v/100 : (v<=1 ? v : v/100); M.to = Math.min(1,Math.max(0,frac)); }
  else if (key==='pm') M.pm = Math.max(0,v);
  else if (key==='closed'){ M.closed = Math.max(0,Math.round(v)); }
  else if (key==='n1.sold') M.n1.sold = Math.max(0,v);
  else if (key==='n1.heb') M.n1.heb = Math.max(0,v);
  else if (key==='n1.tot') M.n1.tot = Math.max(0,v);
}
app.addEventListener('input', e=>{
  const t=e.target, b=cur(); if(!b) return;
  if (t.matches('input.cell')){ setMonthValue(b,+t.dataset.i,t.dataset.k,t.value); refresh(); persist(b); }
  else if (t.matches('textarea.cmt')){ b.months[+t.dataset.i].comment = t.value.slice(0,500); persist(b); }
  else if (t.dataset.p){ applyParam(b,t,false); }
});
app.addEventListener('change', e=>{
  const t=e.target, b=cur(); if(!b) return;
  if (t.matches('input.cell')) t.value = inputVal(b,+t.dataset.i,t.dataset.k);
  else if (t.dataset.p) applyParam(b,t,true);
});
function applyParam(b,t,commit){
  const p = t.dataset.p;
  if (['hotel','scenario','author','notes'].includes(p)){ b[p]=t.value; persist(b); if(commit&&(p==='hotel'||p==='scenario')){ renderSelect(); const h=app.querySelector('h1'); if(h) h.innerHTML = esc(b.hotel)+(b.scenario?` <em>· ${esc(b.scenario)}</em>`:''); } return; }
  if (p==='status'){ b.status=t.value; persist(b); refresh(); return; }
  if (p==='startMonth'||p==='startYear'){ if(!commit) return; const nv=parseInt(t.value,10);
    if (p==='startMonth' && nv!==b.startMonth){ const shift=(nv-b.startMonth+12)%12; const old=b.months.slice(); b.months=old.map((_,i)=>old[(i+shift)%12]); }
    b[p]=nv; persist(b); renderAll(); return; }
  const v = parseNum(t.value); if(!isFinite(v)) return;
  if (p==='extrasCoef') b.extrasCoef = Math.max(0,v/100);
  else b[p] = Math.max(0,v);
  persist(b); refresh();
  if (commit && p==='extrasCoef') t.value = F.dec(b.extrasCoef*100).replace(',0','')+' %';
}
/* Enter / arrows move like a spreadsheet; paste spreads Excel rows across months. */
app.addEventListener('keydown', e=>{
  const t=e.target; if(!t.matches('input.cell')) return;
  const i=+t.dataset.i, r=+t.dataset.r; let target=null;
  if (e.key==='Enter'||e.key==='ArrowDown') target = app.querySelector(`input.cell[data-r="${r+(e.shiftKey&&e.key==='Enter'?-1:1)}"][data-i="${i}"]`);
  else if (e.key==='ArrowUp') target = app.querySelector(`input.cell[data-r="${r-1}"][data-i="${i}"]`);
  else if (e.key==='ArrowRight' && t.selectionStart===t.value.length) target = app.querySelector(`input.cell[data-r="${r}"][data-i="${i+1}"]`);
  else if (e.key==='ArrowLeft' && t.selectionStart===0) target = app.querySelector(`input.cell[data-r="${r}"][data-i="${i-1}"]`);
  if (target){ e.preventDefault(); target.focus(); target.select(); }
});
app.addEventListener('focusin', e=>{ if(e.target.matches('input.cell')) setTimeout(()=>e.target.select(),0); });
app.addEventListener('paste', e=>{
  const t=e.target; if(!t.matches('input.cell')) return;
  const text = (e.clipboardData||window.clipboardData).getData('text'); if(!/[\t\n]/.test(text.trim())) return;
  e.preventDefault(); const b=cur();
  const lines = text.replace(/\r/g,'').split('\n').filter((l,ix,a)=>l.length||ix<a.length-1);
  let n=0;
  lines.forEach((line,li)=>{
    const rowEl = app.querySelector(`input.cell[data-r="${+t.dataset.r+li}"][data-i="0"]`); if(!rowEl) return;
    line.split('\t').forEach((cell,ci)=>{ const i=+t.dataset.i+ci; if(i>11) return; setMonthValue(b,i,rowEl.dataset.k,cell); n++; });
  });
  persist(b); renderAll(); toast(`${n} valeur${n>1?'s':''} collée${n>1?'s':''}`);
});

    case 'confirm-delete': { const id=pendingDelete; closeModal(); if(id){ removeBudget(id).then(()=>{ state.currentId=null; pickCurrent(); renderAll(); toast('Budget supprimé'); }); } break; }

    case 'adj-to': { const v=parseNum(document.getElementById('a-to').value); if(!isFinite(v)) return toast('Saisissez des points, par ex. +2'); b.months.forEach(m=>m.to=Math.min(1,Math.max(0,m.to+v/100))); persist(b); renderAll(); toast(`TO ajusté de ${F.pts(v/100)} sur 12 mois`); break; }
    case 'from-n1': { const v=parseNum(document.getElementById('a-n1').value); if(!isFinite(v)) return toast('Saisissez un pourcentage'); const {rows}=compute(b); b.months.forEach((m,i)=>{ if(rows[i].soldN1){ m.pm=Math.round(rows[i].pmN1*(1+v/100)); m.to=Math.min(1,rows[i].toN1); } }); persist(b); renderAll(); toast(`TO = N-1, PM = N-1 ${F.var(v/100)}`); break; }
    case 'reset-extras': b.months.forEach(m=>m.extras=null); persist(b); renderAll(); toast('Extras recalculés depuis le N-1'); break;
  }
});
document.getElementById('budgetSelect').addEventListener('change', e=>{ state.currentId=e.target.value; rememberCurrent(); if(state.mode==='local') lsWrite(); renderAll(); });
document.getElementById('importFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;

});
function rollForward(b){
  const {rows} = compute(b);
  const c = normalize(JSON.parse(JSON.stringify(b))); c.id=uid(); c.startYear=b.startYear+1; c.status='draft'; c.roomsN1=b.rooms; c.scenario=b.scenario||'Base';

/* ---------- Exports ---------- */
const loaded = {};
function loadScript(src){ return loaded[src] || (loaded[src] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete loaded[src]; rej(new Error('load')); }; document.head.appendChild(s); })); }
const fileBase = b => ('Budget_' + b.hotel + (b.scenario?'_'+b.scenario:'') + '_' + exerciseLabel(b)).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/_+/g,'_');
async function saveFile(filename, blob){
  let dl=null;
  try{ if(window.claude && typeof window.claude.use==='function') dl = await window.claude.use('downloads'); }catch(e){ dl=null; }
  if (dl){
    try{ await dl.save({filename, data:blob}); toast('Fichier enregistré : '+filename); }
    catch(e){ if(e&&e.code==='declined') toast('Téléchargement annulé'); else if(e&&e.code==='rate_limited') toast('Un téléchargement est déjà en attente'); else toast('Téléchargement indisponible ici'); }
    return;
  }
  const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Fichier téléchargé : '+filename);
}
async function runExport(kind){
  const b=cur(); if(!b) return;
  try{
    if (kind==='json') return saveFile(fileBase(b)+'.json', new Blob([JSON.stringify(b,null,2)],{type:'application/json'}));
    if (kind==='csv') return saveFile(fileBase(b)+'.csv', new Blob(['﻿'+buildCSV(b)],{type:'text/csv'}));
    if (kind==='xlsx'){ toast('Préparation du fichier Excel…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); return saveFile(fileBase(b)+'.xlsx', await buildXLSX(b)); }
    if (kind==='pdf'){ toast('Préparation du PDF…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'); return saveFile(fileBase(b)+'.pdf', await buildPDF(b)); }
  }catch(e){ console.error(e); toast('Export impossible : la bibliothèque n’a pas pu être chargée.'); }
}
function tableData(b){
  const {rows,T} = compute(b); const Td=derive(T);
  const out=[];
  ROWS.forEach(R=>{
    if (R.sect){ out.push({sect:R.sect}); return; }
    if (R.comment){ out.push({label:R.l, cells:b.months.map(m=>m.comment), total:'', comment:1}); return; }
    const f = R.input==='extras' ? 'eur2' : R.f;
    const cells = rows.map(r=>{ const d=derive(r); return R.k in d ? d[R.k] : r[R.k]; });
    const total = R.k in Td ? Td[R.k] : (R.k==='share'?1:T[R.k]);
    out.push({label:R.l, k:R.k, f, cells, total, strong:R.strong, key:R.key, sign:R.sign});
  });
  return {rows,T,Td,out};
}
function buildCSV(b){
  const {out,rows} = tableData(b);
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';
  const num = (v,f) => v==null||!isFinite(v) ? '' : (['pct','var','pts'].includes(f) ? (v*100).toFixed(2) : (Math.round(v*100)/100).toString()).replace('.',',');
  const lines = [[q(b.hotel+(b.scenario?' - '+b.scenario:'')), q('Budget '+exerciseLabel(b))].join(';'), ['Indicateur',...rows.map(r=>MONTHS[r.p.m]+' '+r.p.y),'Total'].map(q).join(';')];
  out.forEach(o=>{ if(o.sect) return; const unit = ['pct','var'].includes(o.f)?' (%)':o.f==='pts'?' (pts)':o.f&&o.f.startsWith('eur')?' (€)':''; lines.push([q(o.label+unit), ...o.cells.map(c=>o.comment?q(c):num(c,o.f)), o.comment?'':num(o.total,o.f)].join(';')); });
  return lines.join('\r\n');
}

async function buildXLSX(b){

  ws.getCell('A2').font={size:10,color:{argb:'FFD9B68E'}}; ws.getCell('A2').fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; ws.getCell('A2').alignment={indent:1};

  ps.getCell('B6').numFmt='0%'; ['B4','B5','B6'].forEach(a=>{ps.getCell(a).font={bold:true,color:{argb:ELEC}};ps.getCell(a).fill={type:'pattern',pattern:'solid',fgColor:{argb:LAV}};});
  ps.getCell('B10').alignment={wrapText:true,vertical:'top'}; ps.mergeCells('B10:C10'); ps.getRow(10).height=60;
  const P = {rooms:"'Paramètres'!$B$4", roomsN1:"'Paramètres'!$B$5", coef:"'Paramètres'!$B$6"};
  // Header row 4
  const hr = ws.getRow(4); hr.values = ['Indicateur', ...rows.map(r=>`${MSHORT[r.p.m]} ${r.p.y}`), 'Total'];
  hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ELEC}};c.alignment={horizontal:'center',vertical:'middle'};}); hr.height=22; ws.getCell('A4').alignment={horizontal:'left',indent:1};
  let rn = 5; const R = {};
  const EUR='#,##0 "€"', EUR2='#,##0.00 "€"', INT='#,##0', PCT='0.0%', VARP='+0.0%;-0.0%;0.0%', VARE='+#,##0 "€";-#,##0 "€";0 "€"', PTS='+0.0" pts";-0.0" pts";0.0" pts"';
  const sect = t => { const r=ws.getRow(rn++); r.getCell(1).value=t.toUpperCase(); r.getCell(1).font={bold:true,size:9,color:{argb:GOLD}}; r.height=20; r.getCell(1).alignment={vertical:'bottom'}; };
  const addRow = (key,label,cellFn,totFn,fmt,opt={}) => {
    const r = ws.getRow(rn); R[key]=rn;
    r.getCell(1).value=label; r.getCell(1).alignment={indent:1};
    for(let i=0;i<12;i++){ const c=r.getCell(i+2); c.value=cellFn(i,C(i),rn); c.numFmt=fmt; if(opt.input){ c.font={color:{argb:ELEC},bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:opt.n1?N1:LAV}}; if(opt.n1) c.font={color:{argb:INK}}; } }
    const t=r.getCell(14); t.value=totFn?totFn(rn):null; t.numFmt=fmt; t.font={bold:true}; t.fill={type:'pattern',pattern:'solid',fgColor:{argb:TOT}};
    if(opt.strong){ r.eachCell({includeEmpty:false},c=>{ c.font={...(c.font||{}),bold:true}; }); }
    for(let col=1;col<=14;col++) r.getCell(col).border={bottom:{style:'thin',color:{argb:LINE}}};
    rn++; return rn-1;
  };
  const sum = row => ({formula:`SUM(B${row}:M${row})`});
  const f = (expr) => ({formula:expr});
  sect('Capacité');
  addRow('days','Nombre de jours',i=>rows[i].days,sum,INT);
  addRow('closed','Jours de fermeture',i=>b.months[i].closed,sum,INT,{input:1});
  addRow('avail','Chambres disponibles',(i,c)=>f(`(${c}${R.days}-${c}${R.closed})*${P.rooms}`),sum,INT);
  sect('Hypothèses budget');
  addRow('to',"Taux d'occupation (TO)",i=>b.months[i].to,()=>null,PCT,{input:1});
  addRow('pm','Prix moyen HEB (PM)',i=>b.months[i].pm,()=>null,EUR,{input:1});
  const extrasRow = rn; // filled after N-1 rows are known
  addRow('extras','Extras par nuitée',()=>null,()=>null,EUR2,{input:1});

  addRow('revpar','RevPAR',(i,c)=>f(`IFERROR(${c}${R.heb}/${c}${R.avail},0)`),()=>null,EUR2);
  addRow('trevpar','TRevPAR',(i,c)=>f(`IFERROR(${c}${R.tot}/${c}${R.avail},0)`),()=>null,EUR2);
  addRow('share','Saisonnalité (% CA annuel)',(i,c)=>f(`IFERROR(${c}${R.tot}/$N$${R.tot},0)`),sum,PCT);
  sect('Réalisé N-1');
  addRow('daysN1','Nombre de jours N-1',i=>rows[i].daysN1,sum,INT);

  addRow('soldN1','Chambres louées N-1',i=>b.months[i].n1.sold,sum,INT,{input:1,n1:1});
  addRow('hebN1','CA hébergement N-1',i=>b.months[i].n1.heb,sum,EUR,{input:1,n1:1});
  addRow('totN1','CA total N-1',i=>b.months[i].n1.tot,sum,EUR,{input:1,n1:1});
  addRow('toN1','TO N-1',(i,c)=>f(`IFERROR(${c}${R.soldN1}/${c}${R.availN1},0)`),null,PCT);
  addRow('pmN1','PM N-1',(i,c)=>f(`IFERROR(${c}${R.hebN1}/${c}${R.soldN1},0)`),null,EUR);
  addRow('extN1','Extras par nuitée N-1',(i,c)=>f(`IFERROR((${c}${R.totN1}-${c}${R.hebN1})/${c}${R.soldN1},0)`),null,EUR2);
  addRow('revparN1','RevPAR N-1',(i,c)=>f(`IFERROR(${c}${R.hebN1}/${c}${R.availN1},0)`),null,EUR2);
  sect('Écarts vs N-1');
  addRow('dHeb','Écart CA HEB',(i,c)=>f(`${c}${R.heb}-${c}${R.hebN1}`),null,VARE);
  addRow('dHebP','Écart CA HEB %',(i,c)=>f(`IFERROR(${c}${R.heb}/${c}${R.hebN1}-1,"")`),null,VARP);
  addRow('dTot','Écart CA total',(i,c)=>f(`${c}${R.tot}-${c}${R.totN1}`),null,VARE,{strong:1});
  addRow('dTotP','Écart CA total %',(i,c)=>f(`IFERROR(${c}${R.tot}/${c}${R.totN1}-1,"")`),null,VARP,{strong:1});
  addRow('dTo','Écart TO',(i,c)=>f(`(${c}${R.to}-${c}${R.toN1})*100`),null,PTS);
  addRow('dPm','Écart PM %',(i,c)=>f(`IFERROR(${c}${R.pm}/${c}${R.pmN1}-1,"")`),null,VARP);
  addRow('dRev','Écart RevPAR %',(i,c)=>f(`IFERROR(${c}${R.revpar}/${c}${R.revparN1}-1,"")`),null,VARP);
  // Extras: overrides stay as values, automatic ones become formulas on N-1
  for(let i=0;i<12;i++){ const c=C(i); ws.getCell(`${c}${extrasRow}`).value = b.months[i].extras!=null ? b.months[i].extras : f(`${c}${R.extN1}*${P.coef}`); if(b.months[i].extras==null) ws.getCell(`${c}${extrasRow}`).font={italic:true,color:{argb:ELEC}}; }
  // Weighted totals
  const T = (k,expr)=>{ ws.getCell(`${TC}${R[k]}`).value = f(expr); };
  T('to',`IFERROR(N${R.nights}/N${R.avail},0)`); T('pm',`IFERROR(N${R.heb}/N${R.nights},0)`); T('extras',`IFERROR(N${R.ext}/N${R.nights},0)`);
  T('revpar',`IFERROR(N${R.heb}/N${R.avail},0)`); T('trevpar',`IFERROR(N${R.tot}/N${R.avail},0)`);
  ['toN1','pmN1','extN1','revparN1','dHeb','dHebP','dTot','dTotP','dTo','dPm','dRev'].forEach(k=>{ const tmpl = ws.getCell(`B${R[k]}`).value.formula.replace(/\bB(\d+)/g,'N$1'); T(k,tmpl); });

  ['dHeb','dHebP','dTot','dTotP','dTo','dPm','dRev'].forEach(k=>{
    ws.addConditionalFormatting({ref:`B${R[k]}:N${R[k]}`, rules:[
      {type:'cellIs',operator:'greaterThan',formulae:['0'],style:{font:{color:{argb:'FF1E7F4F'}}}},
      {type:'cellIs',operator:'lessThan',formulae:['0'],style:{font:{color:{argb:'FFB4362F'}}}}]});
  });
  ws.getRow(R.daysN1).hidden = false;
  sect('Commentaires');
  const cr = ws.getRow(rn); cr.getCell(1).value='Commentaire du mois'; cr.getCell(1).alignment={indent:1,vertical:'top'};
  b.months.forEach((m,i)=>{ const c=cr.getCell(i+2); c.value=m.comment||''; c.alignment={wrapText:true,vertical:'top'}; c.font={size:9}; });
  cr.height = Math.min(120, 15*Math.max(1,...b.months.map(m=>Math.ceil((m.comment||'').length/18))));
  rn+=2;
  ws.getCell(`A${rn}`).value='Cellules bleues : hypothèses modifiables. Cellules grises : réalisé N-1. Les autres valeurs sont calculées par formule.'; ws.getCell(`A${rn}`).font={italic:true,size:9,color:{argb:'FF6B6A73'}};
  // highlight key rows
  [R.tot].forEach(r=>{ for(let col=1;col<=13;col++){ const c=ws.getRow(r).getCell(col); c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF1F0FD'}}; } });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

function svgToPng(svg, w, h){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h); res(c.toDataURL('image/png')); }; img.onerror=rej; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
}
async function buildPDF(b){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const {rows,T,Td,out} = tableData(b);
  const W=297, M=12;
  const ink=[29,29,27], elec=[55,33,202], gold=[178,137,88], muted=[107,106,115];
  const header = () => {
    doc.setFillColor(...ink); doc.rect(0,0,W,20,'F');
    if (logoPng) doc.addImage(logoPng,'PNG',M,5.5,28,8.9);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`${b.hotel}${b.scenario?' · '+b.scenario:''}`, W-M, 9, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(217,182,142);
    doc.text(`Budget prévisionnel ${exerciseLabel(b)} · ${periodLabel(b)} · ${STATUSES[b.status]}`, W-M, 14.5, {align:'right'});
  };
  let logoPng=null; try{ logoPng = await svgToPng(LOGO_SVG, 622, 198); }catch(e){}
  header();
  // KPI boxes
  const kp = [['CA total',F.eur(T.tot),Td.dTotP,0],['CA hébergement',F.eur(T.heb),Td.dHebP,0],["Taux d'occupation",F.pct(T.to),Td.dTo,1],['Prix moyen',F.eur(T.pm),Td.dPm,0],['RevPAR',F.eur2(T.revpar),Td.dRev,0],['Nuitées',F.int(T.nights),pct(T.nights,T.soldN1),0]];
  const bw=(W-2*M-5*4)/6; let y=25;
  kp.forEach((k,i)=>{ const x=M+i*(bw+4); const lead=i===0;
    doc.setFillColor(...(lead?elec:[244,243,250])); doc.roundedRect(x,y,bw,19,2,2,'F');
    doc.setTextColor(...(lead?[255,255,255]:muted)); doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.text(k[0].toUpperCase(),x+4,y+5.5);
    doc.setTextColor(...(lead?[255,255,255]:ink)); doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.text(k[1],x+4,y+12);
    const v=k[2]; doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.setTextColor(...(lead?[230,228,255]:(v>0?[30,127,79]:v<0?[180,54,47]:muted))); doc.text('vs N-1 : '+(k[3]?F.pts(v):F.var(v)),x+4,y+16.5);
  });
  y += 24;
  doc.setTextColor(...muted); doc.setFontSize(8);
  doc.text(`${b.rooms} chambres budget · ${b.roomsN1} chambres N-1 · Extras/nuitée = ${F.dec(b.extrasCoef*100)} % du N-1${b.author?' · Revenue manager : '+b.author:''}`, M, y);
  // Table
  const head = [['Indicateur',...rows.map(r=>`${MSHORT[r.p.m]} ${String(r.p.y).slice(2)}`),'Total']];
  const body = []; const meta=[];
  out.forEach(o=>{
    if (o.sect==='Commentaires') return;
    if (o.sect){ body.push([{content:o.sect.toUpperCase(), colSpan:14, styles:{textColor:gold, fontStyle:'bold', fontSize:6.8, fillColor:[255,255,255], cellPadding:{top:1.4,bottom:0.4,left:1.5}}}]); meta.push(null); return; }
    if (o.comment) return;
    const fmt = v => F[o.f](v).replace(' €','€');
    body.push([o.label, ...o.cells.map(fmt), fmt(o.total)]); meta.push(o);
  });
  doc.autoTable({head, body, startY:y+3, margin:{left:M,right:M,top:26}, theme:'plain',
    styles:{font:'helvetica', fontSize:6.2, cellPadding:{top:0.62,bottom:0.62,left:1,right:1}, halign:'right', textColor:ink, lineColor:[227,226,233], lineWidth:{bottom:0.1}},
    headStyles:{fillColor:elec, textColor:[255,255,255], fontStyle:'bold', halign:'right'},
    columnStyles:{0:{halign:'left', cellWidth:44}, 13:{fontStyle:'bold', fillColor:[241,240,253]}},
    didParseCell:d=>{ if(d.section!=='body') { if(d.column.index===0) d.cell.styles.halign='left'; return; } const o=meta[d.row.index]; if(!o) return;
      if(o.strong) d.cell.styles.fontStyle='bold';
      if(o.key && d.column.index>0) d.cell.styles.fillColor = d.column.index===13?[228,225,250]:[246,245,253];
      if(o.sign && d.column.index>0){ const v = d.column.index===13?o.total:o.cells[d.column.index-1]; if(v>0.00001) d.cell.styles.textColor=[30,127,79]; else if(v<-0.00001) d.cell.styles.textColor=[180,54,47]; } },
    didDrawPage:()=>{ if(doc.internal.getNumberOfPages()>1) header(); }
  });
  // Chart + notes page
  doc.addPage(); header();
  doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text("CA total et taux d'occupation, budget vs N-1", M, 30);
  const C = {bar:'#3721CA', n1:'#C9C7D3', to:'#B28958', toN1:'#ADB7F9', text:'#6B6A73', grid:'#E3E2E9', fg:'#1D1D1B'};
  try{ const png = await svgToPng(chartSVG(rows,C), 1920, 680); doc.addImage(png,'PNG',M,34,W-2*M,(W-2*M)*680/1920); }catch(e){}
  let ly = 34 + (W-2*M)*680/1920 + 4;
  const legend=[['CA budget','#3721CA'],['CA N-1','#C9C7D3'],['TO budget','#B28958'],['TO N-1','#ADB7F9']]; let lx=M;
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  legend.forEach(([t,c])=>{ doc.setFillColor(c); doc.rect(lx,ly-2.6,3,3,'F'); doc.setTextColor(...muted); doc.text(t,lx+4.5,ly); lx+=32; });
  ly += 9;
  const cm = b.months.map((m,i)=>m.comment?`${MONTHS[rows[i].p.m]} ${rows[i].p.y} : ${m.comment}`:null).filter(Boolean);
  if (b.notes || cm.length){
    doc.setTextColor(...ink); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Hypothèses et commentaires', M, ly); ly+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...ink);
    const lines = doc.splitTextToSize([b.notes,...cm].filter(Boolean).join('\n'), W-2*M);
    lines.forEach(l=>{ if(ly>200){ doc.addPage(); header(); ly=30; } doc.text(l,M,ly); ly+=4.2; });
  }
  const n = doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(7); doc.setTextColor(...muted); doc.text(`Lewys · Experts en rentabilité hôtelière · Document édité le ${new Date().toLocaleDateString('fr-FR')}`, M, 204); doc.text(`${p} / ${n}`, W-M, 204, {align:'right'}); }
  return doc.output('blob');
}
