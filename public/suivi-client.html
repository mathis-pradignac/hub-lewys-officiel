<html lang="fr">
<head>
<script>/* Lewys Hub : cette page est pilotée depuis le Hub. Ouverte seule, elle repasse par le Hub (connexion, droits, bouton retour). */(function(){try{if(window.top!==window)document.documentElement.classList.add('in-hub');var hub=window.top!==window&&window.parent.LewysHubBridge;if(hub&&hub.online())window.LEWYS_STORE_ADAPTER=hub.suivi;if(window.top===window){var f=location.pathname.split("/").pop();location.replace("index.html#/page/"+encodeURIComponent(f));}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewys · Suivi client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend+Zetta:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* Charte Lewys (relevée sur lewys.fr) */
  --brand:#3721CA; --brand-hover:#2B18A8; --brand-soft:#ECEAFB; --brand-soft-2:#DCD8F7;
  --gold:#B28958; --gold-soft:#D9B68E; --gold-bg:#F7F0E6; --peri:#ADB7F9;
  --ink:#1D1D1B; --ink-2:#2E2E30;
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F1F1F3; --border:#E3E3E8; --border-strong:#C9C9D2;
  --text:#2E2E30; --text-2:#5A5A63; --text-3:#8A8A94;
  --input-bg:#FFFFFF; --input-border:#C9C9D2;
  --good:#1E9E5A; --warn:#E3A21A; --crit:#D2453B; --none:#A3A3AD;
  --good-ink:#16794A; --warn-ink:#8F6200; --crit-ink:#B3362D;
  --good-bg:#E8F6EE; --warn-bg:#FCF4E2; --crit-bg:#FBEAE8;
  --ax-y:#3721CA; --ax-r:#B28958; --ax-t:#7D8CF2;
  --grid:#ECECF1; --shadow:0 1px 2px rgba(29,29,27,.05),0 2px 8px rgba(29,29,27,.05);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
.eyebrow{font-family:"Lexend Zetta","Plus Jakarta Sans",sans-serif;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px 16px;position:relative;overflow:hidden}
#login::before{content:"";position:absolute;inset:auto -20% -40% auto;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(55,33,202,.45),rgba(55,33,202,0) 60%)}
#login::after{content:"";position:absolute;inset:-30% auto auto -20%;width:55vmax;height:55vmax;border-radius:50%;background:radial-gradient(circle,rgba(178,137,88,.25),rgba(178,137,88,0) 60%)}
.login-card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--surface);border-radius:18px;padding:30px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .logo{height:40px;color:var(--ink);display:block;margin-bottom:18px}
.login-card h1{font-size:20px;margin:0 0 4px;color:var(--ink)}
.login-card p{margin:0 0 18px;color:var(--text-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.field input,.field select{border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px;background:var(--surface);min-height:42px}
.field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.err{color:var(--crit-ink);font-size:12.5px;min-height:18px;margin:2px 0 8px}
.login-foot{margin-top:14px;font-size:11.5px;color:var(--text-3);line-height:1.45}

/* ---------- Shell ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.top-inner{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top-inner .logo{height:30px;color:#fff;flex:0 0 auto}
.top-inner .app-name{font-size:12px;color:rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.2);padding-left:12px;margin-right:auto}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.userchip .role{font-size:11px;color:var(--gold-soft)}
.btn-top{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;min-height:32px}
.btn-top:hover{background:rgba(255,255,255,.08)}
nav.tabs{max-width:1320px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;color:rgba(255,255,255,.66);font-weight:600;white-space:nowrap;font-size:13.5px}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:1320px;margin:0 auto;padding:4px 16px 56px}

/* ---------- Contenu ---------- */
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 4px}
.page-head h2{font-size:22px;margin:2px 0 0;color:var(--ink);letter-spacing:-.01em}
.page-head .spacer{flex:1}
.sub{color:var(--text-2);font-size:13px;margin:4px 0 14px;max-width:900px}
h3{font-size:15px;margin:0;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head .spacer{flex:1}
.card-head .hint{font-size:12px;color:var(--text-3)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:960px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.grid2>.card,.grid3>.card{margin-top:0}
.mt{margin-top:14px}

.btn{background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 55%,white)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.btn.block{width:100%;justify-content:center;min-height:42px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,select:focus,input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
select,input[type=text],input[type=number],input[type=password],input[type=month]{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:5px 9px;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{background:transparent;border:0;border-right:1px solid var(--border);padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;min-height:32px;color:var(--text-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:600}

/* Tuiles KPI */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.tile.gold::before{background:var(--gold)}
.tile.crit::before{background:var(--crit)}
.tile .k{font-size:12px;color:var(--text-2);font-weight:600}
.tile .v{font-size:25px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.tile .v small{font-size:13px;font-weight:600;color:var(--text-3)}
.tile .s{font-size:12px;color:var(--text-3);margin-top:2px}
.delta{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:3px}
.delta.up{color:var(--good-ink);background:var(--good-bg)} .delta.down{color:var(--crit-ink);background:var(--crit-bg)}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700;white-space:nowrap;background:var(--surface)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--brand)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--border-strong);border-bottom:0}
.muted{color:var(--text-3)}
.small{font-size:12px}
.hname{font-weight:700;color:var(--ink)}
.strong{font-weight:700}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.st-good{color:var(--good-ink);background:var(--good-bg)} .st-good .dot{background:var(--good)}
.st-warn{color:var(--warn-ink);background:var(--warn-bg)} .st-warn .dot{background:var(--warn)}
.st-crit{color:var(--crit-ink);background:var(--crit-bg)} .st-crit .dot{background:var(--crit)}
.st-none{color:var(--text-2);background:var(--surface-2)} .st-none .dot{background:var(--none)}
.st-brand{color:var(--brand);background:var(--brand-soft)} .st-brand .dot{background:var(--brand)}
.st-gold{color:#7A5A30;background:var(--gold-bg)} .st-gold .dot{background:var(--gold)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.score{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.s1{background:#EFEFF3;color:#5A5A63}.s2{background:#E6E3FA;color:#3721CA}.s3{background:#CFC8F5;color:#2B18A8}.s4{background:#8C7BE6;color:#fff}.s5{background:#3721CA;color:#fff}

/* Barres */
.bar-h{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar-h span{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar-h.gold span{background:var(--gold)}
.bar-h.over span{background:var(--crit)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.rank li:last-child{border-bottom:0}
.rank .n{font-weight:800;color:var(--text-3);font-size:12px}
.rank .nm{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .meta{grid-column:2/4;font-size:11.5px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap}
.rank .val{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.rank .val.good{color:var(--good-ink)} .rank .val.crit{color:var(--crit-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Charts */
.chart-box{position:relative;width:100%}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:170px;z-index:5;display:none}
.tip b{display:block;font-size:13px;margin-bottom:3px;color:var(--ink)}
.tip .l{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
.tip .l span:last-child{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}

/* Bannières */
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid}
.banner .grow{flex:1;min-width:220px}
.banner.warn{background:var(--warn-bg);border-color:#F0D9A5}
.banner.info{background:var(--brand-soft);border-color:var(--brand-soft-2)}
.banner.demo{background:var(--gold-bg);border-color:var(--gold-soft)}
.banner.crit{background:var(--crit-bg);border-color:#F0C4C0}

/* Inputs de saisie */
input.in{background:var(--input-bg);border:1px solid var(--input-border);border-radius:7px;padding:4px 7px;min-height:32px;width:78px;text-align:right;font-variant-numeric:tabular-nums}
input.in.wide{width:104px}
input.in.txt{width:100%;min-width:130px;text-align:left}
select.in{background:var(--input-bg);border:1px solid var(--input-border);border-radius:7px;min-height:32px;padding:3px 6px;max-width:150px}
input.in:focus,select.in:focus{border-color:var(--brand)}
.saved{font-size:12px;color:var(--good-ink);min-width:80px;font-weight:600}
.check{color:var(--good-ink);font-weight:700}
.empty{padding:30px 10px;text-align:center;color:var(--text-3)}

/* Fiche client (panneau latéral) */
.drawer-bg{position:fixed;inset:0;background:rgba(29,29,27,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:51;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer-head{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.drawer-head h3{color:#fff;font-size:18px}
.drawer-head .muted{color:rgba(255,255,255,.65)}
.drawer-body{padding:4px 20px 30px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--text-3);font-weight:600}
.kv dd{margin:0}
.axis-row{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:6px 0}
.axis-row .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.axis-row .track span{display:block;height:100%;border-radius:5px}
.fit{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.fit:last-child{border-bottom:0}
.callout{border-left:3px solid var(--gold);background:var(--gold-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}

/* Modale */
.modal-bg{position:fixed;inset:0;background:rgba(29,29,27,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-bottom:6px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:640px){
  .top-inner .app-name{display:none}
  .userchip .uname{display:none}
  .tile .v{font-size:21px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}

/* Impression / PDF */
@media print{
  body{background:#fff;font-size:11.5px}
  header.top{position:static;background:#fff;color:var(--ink);border-bottom:2px solid var(--brand)}
  .top-inner .logo{color:var(--ink)} .top-inner .app-name{color:var(--text-2);border-color:var(--border)}
  nav.tabs,.userchip,.btn,.btn-top,.seg,select,.no-print,#banners .btn{display:none!important}
  .card,.tile{box-shadow:none;break-inside:avoid}
  .wrap{max-width:none;padding:0}
  .tbl-wrap{overflow:visible}
  .drawer-bg{display:none}
  .drawer{position:static;width:auto;box-shadow:none}
}

/* ----- Affichage dans le Hub Lewys ----- */
.in-hub .top-inner{display:none}
.in-hub header.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.in-hub nav.tabs{padding:6px 16px 0;gap:6px}
.in-hub nav.tabs button{color:var(--text-2);font-size:14px;padding:10px 12px 10px}
.in-hub nav.tabs button:hover{color:var(--ink)}
.in-hub nav.tabs button[aria-selected=true]{color:#3721CA;border-bottom-color:#3721CA}
.in-hub main.wrap{padding-top:22px}
.hubsrc{font-size:10.5px;color:#1E8A5A;font-weight:600;margin-top:2px}
input.in[readonly]{background:#F1FAF5;border-color:#BFE3CD;color:#1D5B3F;cursor:default}
</style>
</head>

<script>
(function(){

/* =====================================================================
   COUCHE DONNÉES

   Pour brancher un serveur, définir AVANT ce script :
     window.LEWYS_STORE_ADAPTER = { load: async () => data|null, save: async (data) => {} }
   ===================================================================== */
var STORAGE_KEY = 'lewys.pilotage.v1';
var SESSION_KEY = 'lewys.pilotage.session';
var DATA_VERSION = 1;
var DEFAULT_PWD = 'Lewys2026';

var localAdapter = {
  load: function(){ try{ var s = localStorage.getItem(STORAGE_KEY); return Promise.resolve(s ? JSON.parse(s) : null); }catch(e){ return Promise.resolve(null); } },

};
var adapter = (window.LEWYS_STORE_ADAPTER && typeof window.LEWYS_STORE_ADAPTER.load === 'function') ? window.LEWYS_STORE_ADAPTER : localAdapter;

/* ---------- SHA-256 (hachage des mots de passe, sans dépendance) ---------- */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow, mw=mp(2,32), i, j, res='';
  var words=[], bl=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pl=k.length;
  var ic={};
  for(var c=2; pl<64; c++){ if(!ic[c]){ for(i=0;i<313;i+=c) ic[i]=c; hash[pl]=(mp(c,.5)*mw)|0; k[pl++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bl/mw)|0); words[words.length]=(bl);
  hash=hash.slice(0,8);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), oh=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; hash.length=8;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); }
  return res;
}
function utf8(s){ return unescape(encodeURIComponent(s)); }
function hashPwd(salt, pwd){ return sha256(utf8(salt + '::' + pwd)); }
function newSalt(){ var a=''; for(var i=0;i<16;i++) a+=Math.floor(Math.random()*16).toString(16); return a; }

/* ---------- Données initiales (issues de Matrice_charge_portefeuille_Lewys.xlsx) ---------- */
function defaultData(){
  function U(id,name,login,role,isAdmin,cost,capacity,sy,sr,st){
    var salt = newSalt();
    return {id:id,name:name,login:login,role:role,isAdmin:isAdmin,cost:cost,capacity:capacity,skills:{y:sy,r:sr,t:st},active:true,salt:salt,pwd:hashPwd(salt,DEFAULT_PWD),mustChange:true};
  }
  // H(nom, ville, ch, interlocuteur, groupe, distrib, pms, RM actuel, phase, Y, R, T, h/mois estimées, honoraires/mois, attribution proposée, signaux)
  function H(name,city,rooms,contact,group,distrib,pms,rm,phase,y,r,t,estH,fee,prop,notes){
    return {id:slug(name),name:name,city:city,rooms:rooms,contact:contact,group:group,distrib:distrib||'',pms:pms||'',rm:rm,proposed:prop,phase:phase,status:'Actif',
      y:y,r:r,t:t,estHours:estH,fixe:fee,varRate:null,varEstimate:null,notes:notes||''};
  }
  var IMMO = 'Immovation';
  return {
    version: DATA_VERSION,
    users: [],   // chargés depuis le serveur du Hub après connexion
    hotels: [],  // idem : aucune donnée client dans ce fichier public
    entries: {},      // "AAAA-Www|hotelId|userId" -> {h, tk, note, ts}
    submissions: {},  // "userId|AAAA-Www" -> date ISO de validation
    settings: { marginTarget: 0.5, costsConfirmed: false, heavy: 11, medium: 7, high: 4, onboardingBoost: 0.2, w:{y:1,r:1,t:1} }
  };
}
function normalize(d){
  var base = defaultData();
  if(!d || typeof d !== 'object') return base;
  d.version = DATA_VERSION;
  d.users = Array.isArray(d.users) && d.users.length ? d.users : base.users;
  d.hotels = Array.isArray(d.hotels) ? d.hotels : base.hotels;
  d.entries = d.entries && typeof d.entries === 'object' ? d.entries : {};
  d.submissions = d.submissions && typeof d.submissions === 'object' ? d.submissions : {};
  d.settings = Object.assign({}, base.settings, d.settings || {});
  d.settings.w = Object.assign({y:1,r:1,t:1}, d.settings.w || {});
  d.users.forEach(function(u){ u.skills = Object.assign({y:3,r:3,t:3}, u.skills||{}); });
  return d;
}

/* ---------- État ---------- */
var state = {
  data:null, me:null, demo:false, realBackup:null,
  tab:null, week:null, month:null, year:null,
  rankMetric:'eurH', sort:{}, entryFor:null, rentPeriod:'month', rentGroup:'hotel', histWeeks:8, clientFilter:'', confirmArmed:null
};
var saveTimer = null;
function persist(immediate){
  if(state.demo) return;
  clearTimeout(saveTimer);
  var run = function(){ Promise.resolve(adapter.save(state.data)).then(flashSaved); };
  if(immediate) run(); else saveTimer = setTimeout(run, 350);
}
function flashSaved(){
  document.querySelectorAll('.saved').forEach(function(el){ el.textContent = 'Enregistré ✓'; });
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(function(){ document.querySelectorAll('.saved').forEach(function(el){ el.textContent=''; }); }, 1500);
}
function toast(msg){
  var t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ---------- Utilitaires ---------- */
var nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
var nf1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
function eur(v){ return (v==null||isNaN(v)||!isFinite(v)) ? '–' : nf0.format(Math.round(v)) + ' €'; }
function eurk(v){ if(v==null||isNaN(v)) return '–'; return Math.abs(v)>=10000 ? nf1.format(v/1000)+' k€' : eur(v); }
function hrs(v){ return (v==null||isNaN(v)) ? '–' : nf1.format(v) + ' h'; }
function pct(v){ return (v==null||isNaN(v)||!isFinite(v)) ? '–' : nf0.format(Math.round(v*100)) + ' %'; }
function n0(v){ return (v==null||isNaN(v)) ? '–' : nf0.format(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v===''||v==null) return null; var n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? null : n; }
function $(id){ return document.getElementById(id); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,28) || ('h'+Date.now().toString(36)); }
function initials(n){ return String(n||'?').split(/[\s-]+/).map(function(p){return p.charAt(0);}).join('').slice(0,2).toUpperCase(); }

function isoWeekKey(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  var y = t.getUTCFullYear(); var ys = new Date(Date.UTC(y,0,1));
  var w = Math.ceil(((t - ys) / 864e5 + 1) / 7);
  return y + '-W' + String(w).padStart(2,'0');
}
function weekMonday(key){
  var p = key.split('-W'); var y = +p[0], w = +p[1];
  var jan4 = new Date(Date.UTC(y,0,4)); var d = jan4.getUTCDay() || 7;
  var mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - d + 1 + (w-1)*7); return mon;
}
function addWeeks(key, n){
  var m = weekMonday(key); m.setUTCDate(m.getUTCDate() + 7*n);
  return isoWeekKey(new Date(m.getUTCFullYear(), m.getUTCMonth(), m.getUTCDate()));
}
function monthOfWeek(key){ var m = weekMonday(key); m.setUTCDate(m.getUTCDate()+3); return m.getUTCFullYear() + '-' + String(m.getUTCMonth()+1).padStart(2,'0'); }
var MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function monthLabel(ym, long){ var p = ym.split('-'); return (long?MOIS_L:MOIS)[+p[1]-1] + ' ' + p[0]; }
function weekLabel(key, short){
  var m = weekMonday(key); var e = new Date(m); e.setUTCDate(m.getUTCDate()+6);
  var w = 'S' + key.split('-W')[1];
  if(short) return w;
  var a = m.getUTCDate() + (m.getUTCMonth()!==e.getUTCMonth() ? ' ' + MOIS[m.getUTCMonth()] : '');
  return w + ' · ' + a + '–' + e.getUTCDate() + ' ' + MOIS[e.getUTCMonth()];
}
function lastWeeks(endKey, n){ var out = []; for(var i=n-1;i>=0;i--) out.push(addWeeks(endKey, -i)); return out; }
function weeksOfMonth(ym){
  var p = ym.split('-'); var d = new Date(+p[0], +p[1]-1, 1); var out = []; var k = isoWeekKey(d);
  if(monthOfWeek(k) !== ym) k = addWeeks(k,1);
  while(monthOfWeek(k) === ym){ out.push(k); k = addWeeks(k,1); }
  return out;
}
function addMonths(ym, n){ var p = ym.split('-'); var d = new Date(+p[0], +p[1]-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function user(id){ return state.data.users.find(function(u){return u.id===id;}); }
function hotel(id){ return state.data.hotels.find(function(h){return h.id===id;}); }
function uname(id){ var u = user(id); return u ? u.name : (id || '—'); }
function entryKey(w,h,u){ return w+'|'+h+'|'+u; }
function isAdmin(){ return !!(state.me && state.me.isAdmin); }
function activeHotels(){ return state.data.hotels.filter(function(h){ return h.status !== 'Inactif'; }); }

/* ---------- Profil client (logique de l'onglet Cotation) ---------- */
function profileOf(h){
  var S = state.data.settings, w = S.w;
  var y = +h.y||0, r = +h.r||0, t = +h.t||0;
  var score = (y*w.y + r*w.r + t*w.t) * (h.phase==='Onboarding' ? 1 + S.onboardingBoost : 1);
  score = Math.round(score*10)/10;
  var level = score >= S.heavy ? 'Lourd' : score >= S.medium ? 'Moyen' : 'Léger';
  var dom;
  if(y===r && r===t) dom = 'Équilibré';
  else { var mx = Math.max(y,r,t); dom = y===mx ? 'Yield' : r===mx ? 'Relation' : 'Technique'; }
  var hiY = y >= S.high, hiR = r >= S.high;
  var quad = hiY && hiR ? 'Double exigence' : hiY ? 'Analytique' : hiR ? 'Relationnel' : 'Autonome';
  return {score:score, level:level, dom:dom, quad:quad, techHeavy: t >= S.high};
}
var QUAD_INFO = {
  'Double exigence': {pill:'st-crit', need:'Profil senior : analyse poussée ET relation sensible.', rm:'Associé (senior yield + relation)'},
  'Analytique':      {pill:'st-brand', need:"Forte charge d'analyse, client peu demandeur.", rm:'Production déléguable à un alternant, revue par un associé'},
  'Relationnel':     {pill:'st-gold', need:'Le temps part en pédagogie et en échanges ; yield standardisable.', rm:'Interlocuteur stable et diplomate'},
  'Autonome':        {pill:'st-none', need:'Faible charge sur les deux axes.', rm:'Junior / alternant avec routine cadrée'}
};
function recoProfile(h){
  var p = profileOf(h); var q = QUAD_INFO[p.quad];
  var txt = q.rm;
  if(p.techHeavy) txt += ' + appui technique (CM/PMS, mapping)';
  if(h.phase === 'Onboarding') txt += ' · onboarding : suivi rapproché les 3 premiers mois';
  return txt;
}
/* Adéquation RM ↔ hôtel : écart entre les exigences de l'hôtel (notes 1-5) et les compétences du RM (1-5) */
function fitScore(h, u){
  var need = {y:+h.y||0, r:+h.r||0, t:+h.t||0}, sk = u.skills || {y:3,r:3,t:3};
  var gap = 0, over = 0;
  ['y','r','t'].forEach(function(a){ gap += Math.max(0, need[a]-sk[a]); over += Math.max(0, sk[a]-need[a]-1); });
  return Math.max(0, Math.min(100, Math.round(100 - gap*22 - over*4)));
}
function rmLoad(uid){
  var hs = activeHotels().filter(function(h){return h.rm===uid;});
  return {count:hs.length, rooms:hs.reduce(function(a,h){return a+(h.rooms||0);},0), score:Math.round(hs.reduce(function(a,h){return a+profileOf(h).score;},0)*10)/10};
}
function bestRMs(h){
  return state.data.users.filter(function(u){return u.active;}).map(function(u){ return {u:u, fit:fitScore(h,u), load:rmLoad(u.id)}; })
    .sort(function(a,b){ return b.fit-a.fit || a.load.score-b.load.score; });
}

/* ---------- Calculs de rentabilité ---------- */
function monthlyValue(h){ return (h.fixe||0) + ((h.varRate||0) > 0 ? (h.varEstimate||0) : 0); }
function hasContract(h){ return monthlyValue(h) > 0; }
function weeksWithData(){
  var s = {};
  Object.keys(state.data.entries).forEach(function(k){ s[k.split('|')[0]] = true; });
  return s;
}
/* weeks : liste de semaines ISO ; ne compte que celles saisies (≥ 1 ligne) et ≤ semaine en cours */
function computeStats(weeks){
  var cur = isoWeekKey(new Date());
  var wd = weeksWithData();
  var counted = weeks.filter(function(w){ return wd[w] && w <= cur; });
  var cset = {}; counted.forEach(function(w){ cset[w]=true; });
  var H = {}, U = {};
  state.data.hotels.forEach(function(h){ H[h.id] = {id:h.id, h:h, hours:0, tickets:0, cost:0, revenue:0, byUser:{}, notes:[]}; });
  state.data.users.forEach(function(u){ U[u.id] = {id:u.id, u:u, hours:0, tickets:0, cost:0, value:0, byHotel:{}}; });
  Object.keys(state.data.entries).forEach(function(k){
    var p = k.split('|'); var w=p[0], hid=p[1], uid=p[2];
    if(!cset[w] || !H[hid]) return;
    var e = state.data.entries[k]; var s = H[hid]; var hh = +e.h||0, tk = +e.tk||0;
    var c = (user(uid)||{cost:0}).cost || 0;
    s.hours += hh; s.tickets += tk; s.cost += hh*c;
    s.byUser[uid] = (s.byUser[uid]||0) + hh;
    if(e.note) s.notes.push({w:w, uid:uid, note:e.note});
    if(U[uid]){ U[uid].hours += hh; U[uid].tickets += tk; U[uid].cost += hh*c; U[uid].byHotel[hid] = (U[uid].byHotel[hid]||0) + hh; }
  });
  var n = counted.length;
  state.data.hotels.forEach(function(h){
    var s = H[h.id];
    s.revenue = h.status==='Inactif' ? 0 : monthlyValue(h) * 12/52 * n;
    s.margin = s.revenue - s.cost;
    s.marginPct = s.revenue > 0 ? s.margin/s.revenue : null;
    s.eurH = s.hours > 0 ? s.revenue/s.hours : null;
    s.costH = s.hours > 0 ? s.cost/s.hours : null;
    s.status = statusOf(s);
    s.profile = profileOf(h);
  });
  // Valeur produite par salarié = somme (heures sur l'hôtel × €/h de l'hôtel)
  Object.keys(U).forEach(function(uid){
    var a = U[uid];
    Object.keys(a.byHotel).forEach(function(hid){ var s = H[hid]; if(s && s.eurH!=null) a.value += a.byHotel[hid]*s.eurH; });
    a.eurH = a.hours>0 ? a.value/a.hours : null;
    a.margin = a.value - a.cost;
  });
  var T = {hours:0,tickets:0,cost:0,revenue:0,crit:0,warn:0};
  Object.keys(H).forEach(function(id){ var s=H[id]; if(s.h.status==='Inactif') return; T.hours+=s.hours; T.tickets+=s.tickets; T.cost+=s.cost; T.revenue+=s.revenue; if(s.status.k==='crit') T.crit++; if(s.status.k==='warn') T.warn++; });
  T.margin = T.revenue - T.cost; T.marginPct = T.revenue>0 ? T.margin/T.revenue : null; T.eurH = T.hours>0 ? T.revenue/T.hours : null; T.costH = T.hours>0 ? T.cost/T.hours : null;
  return {weeks:weeks, counted:counted, n:n, H:H, U:U, T:T};
}
function statusOf(s){
  if(!hasContract(s.h)) return {k:'none', label:'Contrat non renseigné'};
  if(s.hours <= 0) return {k:'none', label:'Pas de temps saisi'};
  if(s.marginPct < 0) return {k:'crit', label:'Déficitaire'};
  if(s.marginPct < state.data.settings.marginTarget) return {k:'warn', label:'Sous la cible'};
  return {k:'good', label:'Rentable'};
}
function weeksOfYear(y){ var out=[]; var k = isoWeekKey(new Date(y,0,4)); while(+monthOfWeek(k).slice(0,4) === y){ out.push(k); k = addWeeks(k,1); } return out; }
function periodWeeks(kind){
  if(kind==='month') return weeksOfMonth(state.month);
  if(kind==='year') return weeksOfYear(state.year);
  if(kind==='12w') return lastWeeks(isoWeekKey(new Date()), 12);
  return weeksOfMonth(state.month);
}
function periodLabel(kind){
  if(kind==='month') return monthLabel(state.month, true);
  if(kind==='year') return 'année ' + state.year;
  return '12 dernières semaines';
}

  var deficit = Object.keys(Cm.H).map(function(k){return Cm.H[k];}).filter(function(s){return s.status.k==='crit';});
  if(deficit.length) alerts.push(['crit', deficit.length+' hôtel'+(deficit.length>1?'s':'')+' déficitaire'+(deficit.length>1?'s':'')+' ce mois-ci', deficit.map(function(s){return s.h.name+' ('+eur(s.eurH)+'/h)';}).join(', '), 'rentab']);
  var late = rms.filter(function(u){ return !state.data.submissions[u.id+'|'+prevW]; });
  if(late.length) alerts.push(['warn', 'Semaine '+weekLabel(prevW,true)+' non validée', late.map(function(u){return u.name;}).join(', '), 'equipe']);
  var heavy = act.filter(function(h){return profileOf(h).level==='Lourd';});
  if(heavy.length) alerts.push(['info', heavy.length+' client'+(heavy.length>1?'s':'')+' à charge lourde', heavy.map(function(h){return h.name+' → '+uname(h.rm);}).join(', '), 'clients']);
  var mism = act.filter(function(h){ var u = user(h.rm); return u && fitScore(h,u) < 60; });
  if(mism.length) alerts.push(['info', mism.length+' attribution'+(mism.length>1?'s':'')+' à revoir (adéquation < 60 %)', mism.map(function(h){return h.name+' → '+uname(h.rm);}).join(', '), 'contrats']);
  html += '<div class="card"><h3>Points d’attention</h3><div style="margin-top:8px">';
  if(!alerts.length) html += '<div class="empty">Rien à signaler.</div>';
  alerts.forEach(function(a){
    html += '<div class="banner '+(a[0]==='crit'?'crit':a[0]==='warn'?'warn':'info')+'" style="margin-top:8px"><span class="grow"><b>'+esc(a[1])+'</b><br><span class="small">'+esc(a[2])+'</span></span><button class="btn sm no-print" data-act="goto" data-tab="'+a[3]+'">Voir</button></div>';
  });
  html += '</div></div></div>';

  el.innerHTML = html;
  bindMonthPicker(renderDash);
  el.querySelectorAll('[data-metric]').forEach(function(b){ b.addEventListener('click', function(){ state.rankMetric = b.getAttribute('data-metric'); renderDash(); }); });
  drawYearChart($('yearChart'));
}

function rankCard(title, C, metric, top){
  var list = Object.keys(C.H).map(function(k){return C.H[k];}).filter(function(s){ return hasContract(s.h) && s.hours>0 && s.h.status!=='Inactif'; });
  list.sort(function(a,b){ return top ? (b[metric]-a[metric]) : (a[metric]-b[metric]); });
  list = list.slice(0,5);
  var html = '<div><div class="small strong" style="color:'+(top?'var(--good-ink)':'var(--crit-ink)')+';margin-bottom:2px">'+(top?'▲ ':'▼ ')+esc(title)+'</div>';
  if(!list.length) return html + '<div class="empty small">Pas encore de données sur la période.</div></div>';
  html += '<ol class="rank">';
  list.forEach(function(s,i){
    var v = metric==='eurH' ? eur(s.eurH)+'/h' : metric==='margin' ? eur(s.margin) : pct(s.marginPct);
    var good = s.status.k==='good';
    html += '<li><span class="n">'+(i+1)+'</span><span class="nm">'+hotelLink(s.h)+'</span><span class="val '+(good?'good':s.status.k==='crit'?'crit':'')+'">'+v+'</span>'+
      '<span class="meta"><span>'+esc(uname(s.h.rm))+'</span><span>'+hrs(s.hours)+'</span><span>'+eur(s.revenue)+' d’honoraires</span><span>marge '+pct(s.marginPct)+'</span></span></li>';
  });
  return html + '</ol></div>';
}

function drawYearChart(box){
  if(!box) return;
  var months = []; for(var m=1;m<=12;m++) months.push(state.year+'-'+String(m).padStart(2,'0'));
  var data = months.map(function(ym){ var C = computeStats(weeksOfMonth(ym)); return {ym:ym, rev:C.T.revenue, cost:C.T.cost, margin:C.T.margin, hours:C.T.hours, n:C.n, eurH:C.T.eurH}; });
  var W = Math.max(320, box.clientWidth||640), H = 260, m = {l:54,r:10,t:12,b:28};
  var iw = W-m.l-m.r, ih = H-m.t-m.b;
  var maxV = niceMax(Math.max.apply(null, data.map(function(d){return Math.max(d.rev,d.cost);}).concat([100]))*1.05);
  var minV = Math.min(0, Math.min.apply(null, data.map(function(d){return d.margin;})));
  if(minV<0) minV = -niceMax(-minV);
  var Y = function(v){ return m.t + ih - (v-minV)/(maxV-minV)*ih; };
  var bw = iw/12, barW = Math.max(5, Math.min(18, bw/2-4));
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Honoraires et coût du temps par mois">';
  for(var i=0;i<=4;i++){ var v = minV + (maxV-minV)*i/4; s += '<line x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+eurk(v)+'</text>'; }
  if(minV<0) s += '<line x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--border-strong)"/>';
  var pts = [];
  data.forEach(function(d,i){
    var x0 = m.l + i*bw + bw/2;
    s += '<g class="mb" data-i="'+i+'" tabindex="0"><rect x="'+(m.l+i*bw)+'" y="'+m.t+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>';
    if(d.rev>0) s += '<rect x="'+(x0-barW-1)+'" y="'+Y(d.rev)+'" width="'+barW+'" height="'+(Y(0)-Y(d.rev))+'" rx="3" fill="var(--brand)"/>';
    if(d.cost>0) s += '<rect x="'+(x0+1)+'" y="'+Y(d.cost)+'" width="'+barW+'" height="'+(Y(0)-Y(d.cost))+'" rx="3" fill="var(--gold-soft)"/>';
    s += '</g><text x="'+x0+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="'+(d.ym===state.month?'var(--brand)':'var(--text-3)')+'" font-weight="'+(d.ym===state.month?'700':'400')+'">'+MOIS[i]+'</text>';
    if(d.n) pts.push([x0, Y(d.margin)]);
  });
  if(pts.length>1) s += '<polyline points="'+pts.map(function(p){return p.join(',');}).join(' ')+'" fill="none" stroke="var(--good)" stroke-width="2"/>';
  pts.forEach(function(p){ s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--good)" stroke="var(--surface)" stroke-width="1.5" pointer-events="none"/>'; });
  s += '</svg>';
  var tip = box.querySelector('.tip'); box.innerHTML = s; box.appendChild(tip);
  tipBind(box, 'g.mb', function(g){ var d = data[+g.getAttribute('data-i')];
    return '<b>'+esc(monthLabel(d.ym,true))+'</b>'+(d.n?'':'<div class="muted">Aucune semaine saisie</div>')+
      '<div class="l"><span>Honoraires</span><span>'+eur(d.rev)+'</span></div><div class="l"><span>Coût du temps</span><span>'+eur(d.cost)+'</span></div>'+
      '<div class="l"><span>Marge</span><span>'+eur(d.margin)+'</span></div><div class="l"><span>Heures</span><span>'+hrs(d.hours)+'</span></div><div class="l"><span>€ / h</span><span>'+eur(d.eurH)+'</span></div>'; });
}

  html += '<div class="tbl-wrap"><table><thead><tr>';
  [['name','Hôtel',''],['','Y','c'],['','R','c'],['','T','c'],['score','Charge','num'],['','Niveau',''],['quad','Quadrant',''],['','Profil RM recommandé',''],['rm','RM actuel',''],['fit','Adéquation','num'],['','Meilleur choix',''],['hw','h (12 sem.)','num'],['tk','Tickets','num']].forEach(function(c){

function drawWeekCombo(box, hid, weeks){
  var data = weeks.map(function(w){ var hh=0, tk=0; Object.keys(state.data.entries).forEach(function(k){ var q=k.split('|'); if(q[0]===w && q[1]===hid){ var e=state.data.entries[k]; hh+=+e.h||0; tk+=+e.tk||0; } }); return {w:w,h:hh,tk:tk}; });
  var W = Math.max(300, box.clientWidth||600), H = 190, m = {l:34,r:30,t:10,b:24}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  var maxH = niceMax(Math.max.apply(null, data.map(function(d){return d.h;}).concat([1]))*1.05);
  var maxT = niceMax(Math.max.apply(null, data.map(function(d){return d.tk;}).concat([1]))*1.05);

  });
  var tot = activeHotels().reduce(function(a,h){return a+monthlyValue(h);},0);
  html += '</tbody><tfoot><tr><td colspan="12">Total honoraires mensuels (hôtels actifs)</td><td class="num">'+eur(tot)+'</td><td></td></tr></tfoot></table></div>';

/* =====================================================================
   SAISIE HEBDOMADAIRE (heures + tickets par hôtel)
   ===================================================================== */
var sessionExtra = {};
function renderSaisie(){
  var el = $('view');
  var me = isAdmin() ? (state.entryFor || state.me.id) : state.me.id;
  var w = state.week; var cur = isoWeekKey(new Date());
  var mine = activeHotels().filter(function(h){ return h.rm === me; });
  var extraIds = {};
  activeHotels().forEach(function(h){ if(h.rm !== me && state.data.entries[entryKey(w,h.id,me)]) extraIds[h.id]=true; });
  Object.keys(sessionExtra).forEach(function(k){ var q=k.split('|'); if(q[0]===w && q[1]===me) extraIds[q[2]]=true; });
  var rows = mine.concat(activeHotels().filter(function(h){ return extraIds[h.id]; }));
  var submitted = state.data.submissions[me+'|'+w];
  var locked = !!submitted;
  var others = activeHotels().filter(function(h){ return !rows.some(function(r){return r.id===h.id;}); }).sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  var prevWeek = addWeeks(w,-1);
  var hasPrev = Object.keys(state.data.entries).some(function(k){ var q=k.split('|'); return q[0]===prevWeek && q[2]===me; });
  var u = user(me);

  var right = '<div class="row no-print">'+(isAdmin()?'<label class="ctl">Saisie de <select id="entryFor">'+state.data.users.filter(function(x){return x.active;}).map(function(x){return '<option value="'+x.id+'"'+(x.id===me?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select></label>':'')+
    '<button class="btn sm" id="wkPrev" aria-label="Semaine précédente">‹</button><span class="strong" style="min-width:150px;text-align:center">'+esc(weekLabel(w))+'</span><button class="btn sm" id="wkNext" aria-label="Semaine suivante" '+(w>=cur?'disabled':'')+'>›</button>'+(w!==cur?'<button class="btn sm ghost" id="wkNow">Cette semaine</button>':'')+'</div>';
  var html = pageHead('Saisie hebdomadaire'+(me!==state.me.id?' · pour '+esc(uname(me)):''), (me===state.me.id?'Mes heures & demandes':'Heures & demandes de '+esc(uname(me))), right);
  if(document.documentElement.classList.contains('in-hub')) html += '<p class="sub"><b>Vos heures remontent automatiquement</b> de la saisie quotidienne faite sur l’accueil du Hub (cases vertes). Il vous reste à indiquer ici le <b>nombre de demandes / tickets</b> traités et, si besoin, un commentaire, puis à cliquer sur « Valider ma semaine » le vendredi.</p>'; else
  html += '<p class="sub">À remplir en fin de semaine (le vendredi) : pour chaque hôtel de votre portefeuille, le <b>temps passé</b> (au quart d’heure, ex. 1,5) et le <b>nombre de demandes / tickets</b> traités (mails, appels, demandes du client, incidents). Hôtel non travaillé : laissez vide. Puis cliquez sur « Valider ma semaine ».</p>';
  html += '<div class="card"><div class="card-head"><h3>'+esc(weekLabel(w))+'</h3>'+(locked?'<span class="pill st-good">✓ Validée le '+new Date(submitted).toLocaleDateString('fr-FR')+'</span>':'')+'<span class="spacer"></span><span class="saved"></span></div>';
  if(!rows.length){
    html += '<div class="empty">Aucun hôtel n’est attribué à '+esc(uname(me))+'. Ajoutez un hôtel ponctuel ci-dessous'+(isAdmin()?' ou attribuez des hôtels dans « Attributions & contrats »':'')+'.</div>';
  } else {
    html += '<div class="tbl-wrap"><table><thead><tr><th>Hôtel</th><th class="num">Heures</th><th class="num">Demandes / tickets</th><th>Commentaire (optionnel)</th></tr></thead><tbody>';
    rows.forEach(function(h){
      var e = state.data.entries[entryKey(w,h.id,me)] || {};
      var extra = h.rm !== me;
      html += '<tr data-h="'+esc(h.id)+'"><td><span class="hname">'+esc(h.name)+'</span>'+(extra?' <span class="tag">ponctuel · RM '+esc(uname(h.rm))+'</span>':'')+(h.phase==='Onboarding'?' <span class="pill st-gold">Onboarding</span>':'')+'<div class="muted small">'+esc(h.city||'')+'</div></td>'+
        '<td class="num"><input class="in" type="number" min="0" max="80" step="0.25" inputmode="decimal" data-f="h" value="'+(e.h?e.h:'')+'" '+(locked?'disabled':(e.src==='hub'?'readonly title="Heures issues de la saisie quotidienne du Hub"':''))+' aria-label="Heures '+esc(h.name)+'">'+(e.src==='hub'?'<div class="hubsrc">saisie du Hub</div>':'')+'</td>'+
        '<td class="num"><input class="in" type="number" min="0" max="500" step="1" inputmode="numeric" data-f="tk" value="'+(e.tk?e.tk:'')+'" '+(locked?'disabled':'')+' aria-label="Tickets '+esc(h.name)+'"></td>'+
        '<td><input class="in txt" type="text" data-f="note" maxlength="200" value="'+esc(e.note||'')+'" '+(locked?'disabled':'')+' placeholder="ex. refonte grille 2027, incident synchro…"></td></tr>';
    });
    html += '</tbody><tfoot><tr><td>Total semaine</td><td class="num" id="sumH"></td><td class="num" id="sumT"></td><td class="muted small" id="sumCap"></td></tr></tfoot></table></div>';
  }
  html += '<div class="row no-print" style="margin-top:14px">';
  if(!locked){
    html += '<select id="addExtra"><option value="">+ Temps ponctuel sur un autre hôtel…</option>'+others.map(function(h){return '<option value="'+esc(h.id)+'">'+esc(h.name)+'</option>';}).join('')+'</select>';
    html += '<button class="btn" id="copyPrev" '+(hasPrev?'':'disabled')+'>Copier la semaine précédente</button>';
  }
  html += '<span class="spacer"></span>';
  html += locked ? '<button class="btn" id="unsubmit">Rouvrir pour corriger</button>' : '<button class="btn primary" id="submitWeek">Valider ma semaine</button>';
  html += '</div></div>';

  // Historique récent
  var hist = lastWeeks(w, 6);
  html += '<div class="card"><div class="card-head"><h3>6 dernières semaines</h3><span class="spacer"></span>'+(isAdmin()?'':'<button class="btn sm ghost" data-act="goto" data-tab="histo">Historique complet →</button>')+'</div><div class="tbl-wrap"><table><thead><tr><th>Semaine</th><th class="num">Heures</th><th class="num">Tickets</th><th>Statut</th></tr></thead><tbody>';
  hist.slice().reverse().forEach(function(wk){
    var t=0, tk=0; Object.keys(state.data.entries).forEach(function(k){ var q=k.split('|'); if(q[0]===wk && q[2]===me){ t+=+state.data.entries[k].h||0; tk+=+state.data.entries[k].tk||0; } });
    var sub = state.data.submissions[me+'|'+wk];
    html += '<tr class="clickable" data-wk="'+wk+'"><td>'+esc(weekLabel(wk))+'</td><td class="num">'+(t?hrs(t):'–')+'</td><td class="num">'+(tk||'–')+'</td><td>'+(sub?'<span class="pill st-good">✓ validée</span>':(t?'<span class="pill st-warn">en cours</span>':'<span class="pill st-none">non saisie</span>'))+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  el.innerHTML = html;
  updateTotals(me, w, u);

  el.querySelectorAll('tr[data-h] input').forEach(function(inp){
    inp.addEventListener('input', function(){
      var tr = inp.closest('tr'); var hid = tr.getAttribute('data-h'); var k = entryKey(w, hid, me);
      var e = state.data.entries[k] || {h:0,tk:0,note:''}; var f = inp.getAttribute('data-f');
      if(f==='note') e.note = inp.value.trim();
      else { var v = num(inp.value); e[f] = v && v>0 ? (f==='tk' ? Math.min(Math.round(v),500) : Math.min(v,80)) : 0; }
      e.ts = new Date().toISOString(); e.by = state.me.id;
      if(!e.h && !e.tk && !e.note) delete state.data.entries[k]; else state.data.entries[k] = e;
      updateTotals(me, w, u); persist();
    });
  });
  el.querySelectorAll('tr[data-wk]').forEach(function(tr){ tr.addEventListener('click', function(){ state.week = tr.getAttribute('data-wk'); renderSaisie(); window.scrollTo(0,0); }); });
  var ef = $('entryFor'); if(ef) ef.addEventListener('change', function(){ state.entryFor = ef.value; renderSaisie(); });
  $('wkPrev').addEventListener('click', function(){ state.week = addWeeks(state.week,-1); renderSaisie(); });
  $('wkNext').addEventListener('click', function(){ if(state.week<cur){ state.week = addWeeks(state.week,1); renderSaisie(); } });
  var wn = $('wkNow'); if(wn) wn.addEventListener('click', function(){ state.week = cur; renderSaisie(); });
  var ae = $('addExtra'); if(ae) ae.addEventListener('change', function(){ if(!ae.value) return; sessionExtra[w+'|'+me+'|'+ae.value]=true; renderSaisie(); });
  var cp = $('copyPrev'); if(cp) cp.addEventListener('click', function(){
    var n=0; Object.keys(state.data.entries).forEach(function(k){ var q=k.split('|'); if(q[0]!==prevWeek || q[2]!==me) return; var nk = entryKey(w,q[1],me);
      if(!state.data.entries[nk]){ var e = state.data.entries[k]; state.data.entries[nk] = {h:e.h||0, tk:e.tk||0, note:'', ts:new Date().toISOString(), by:state.me.id}; n++; } });
    persist(true); toast(n+' ligne'+(n>1?'s':'')+' copiée'+(n>1?'s':'')); renderSaisie();
  });
  var sw = $('submitWeek'); if(sw) sw.addEventListener('click', function(){
    var any = Object.keys(state.data.entries).some(function(k){ var q=k.split('|'); return q[0]===w && q[2]===me; });
    if(!any && state.confirmArmed!=='empty'){ state.confirmArmed='empty'; sw.textContent='Aucune heure saisie — valider quand même ?'; return; }
    state.confirmArmed=null; state.data.submissions[me+'|'+w] = new Date().toISOString(); persist(true); toast('Semaine validée, merci !'); renderBanners(); renderSaisie();
  });
  var us = $('unsubmit'); if(us) us.addEventListener('click', function(){ delete state.data.submissions[me+'|'+w]; persist(true); renderSaisie(); });
}
function updateTotals(me, w, u){
  var t=0, tk=0; Object.keys(state.data.entries).forEach(function(k){ var q=k.split('|'); if(q[0]===w && q[2]===me){ t+=+state.data.entries[k].h||0; tk+=+state.data.entries[k].tk||0; } });
  if(!$('sumH')) return;
  $('sumH').textContent = hrs(t); $('sumT').textContent = tk;
  $('sumCap').textContent = u && u.capacity ? 'soit '+pct(t/u.capacity)+' de la capacité suivi client ('+u.capacity+' h / sem.)' : '';
}

/* =====================================================================
   HISTORIQUE (vue RM : ses hôtels, ses heures, ses tickets — sans montants)
   ===================================================================== */
function renderHisto(){
  var el = $('view'); var me = state.me.id;
  var n = state.histWeeks; var wks = lastWeeks(isoWeekKey(new Date()), n);
  var hotelIds = {}; activeHotels().forEach(function(h){ if(h.rm===me) hotelIds[h.id]=1; });
  Object.keys(state.data.entries).forEach(function(k){ var q=k.split('|'); if(q[2]===me && wks.indexOf(q[0])>=0) hotelIds[q[1]]=1; });
  var hs = Object.keys(hotelIds).map(hotel).filter(Boolean).sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  var g = function(w,hid){ return state.data.entries[entryKey(w,hid,me)] || null; };
  var totH=0, totT=0; var weekTot = {}; wks.forEach(function(w){ weekTot[w]={h:0,tk:0}; });
  hs.forEach(function(h){ wks.forEach(function(w){ var e=g(w,h.id); if(e){ totH+=+e.h||0; totT+=+e.tk||0; weekTot[w].h+=+e.h||0; weekTot[w].tk+=+e.tk||0; } }); });
  var filled = wks.filter(function(w){return weekTot[w].h>0;}).length;
  var html = pageHead('Mon historique', 'Temps passé sur mes hôtels', '<div class="seg no-print" role="group"><button data-n="8" aria-pressed="'+(n===8)+'">8 sem.</button><button data-n="13" aria-pressed="'+(n===13)+'">13 sem.</button><button data-n="26" aria-pressed="'+(n===26)+'">26 sem.</button></div> <button class="btn sm no-print" id="expHist">Exporter CSV</button> <button class="btn sm no-print" id="expWeekJson" title="Fichier à transmettre à l’administrateur si l’application n’est pas partagée en réseau">Envoyer mes saisies (fichier)</button>');
  html += '<p class="sub">Heures et demandes que vous avez saisies sur les '+n+' dernières semaines, par hôtel de votre portefeuille. Cliquez sur une semaine dans « Ma saisie hebdo » pour la corriger (si elle n’est pas validée).</p>';
  html += '<div class="tiles">'+tile('Heures', hrs(totH), filled?hrs(totH/filled)+' par semaine saisie':'')+tile('Demandes / tickets', n0(totT), totH?nf1.format(totT/totH)+' par heure':'', 'gold')+tile('Hôtels suivis', hs.length, 'dont '+Object.keys(hotelIds).filter(function(id){var h=hotel(id);return h&&h.rm===me;}).length+' dans mon portefeuille')+tile('Semaines validées', wks.filter(function(w){return state.data.submissions[me+'|'+w];}).length+' / '+n, '')+'</div>';
  html += '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Hôtel</th>'+wks.slice().reverse().map(function(w){return '<th class="num">'+weekLabel(w,true)+'</th>';}).join('')+'<th class="num">Total h</th><th class="num">Tickets</th></tr></thead><tbody>';
  if(!hs.length) html += '<tr><td colspan="'+(wks.length+3)+'" class="empty">Aucun hôtel ni saisie sur la période.</td></tr>';
  hs.forEach(function(h){
    var th=0, tt=0;
    html += '<tr><td><span class="hname">'+esc(h.name)+'</span><div class="muted small">'+esc(h.city||'')+'</div></td>';
    wks.slice().reverse().forEach(function(w){ var e=g(w,h.id); if(e){ th+=+e.h||0; tt+=+e.tk||0; } html += '<td class="num">'+(e&&(e.h||e.tk)?'<b>'+(e.h?nf1.format(e.h):'–')+'</b><div class="muted small">'+(e.tk||0)+' tk</div>':'<span class="muted">·</span>')+'</td>'; });
    html += '<td class="num strong">'+(th?hrs(th):'–')+'</td><td class="num strong">'+(tt||'–')+'</td></tr>';
  });
  html += '</tbody><tfoot><tr><td>Total</td>'+wks.slice().reverse().map(function(w){return '<td class="num">'+(weekTot[w].h?nf1.format(weekTot[w].h):'–')+'</td>';}).join('')+'<td class="num">'+hrs(totH)+'</td><td class="num">'+totT+'</td></tr></tfoot></table></div></div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-n]').forEach(function(b){ b.addEventListener('click', function(){ state.histWeeks = +b.getAttribute('data-n'); renderHisto(); }); });
  $('expHist').addEventListener('click', function(){
    var rows = [['Semaine','Lundi','Hôtel','Heures','Tickets','Commentaire','Validée']];
    wks.forEach(function(w){ hs.forEach(function(h){ var e=g(w,h.id); if(e) rows.push([w, weekMonday(w).toISOString().slice(0,10), h.name, e.h||0, e.tk||0, e.note||'', state.data.submissions[me+'|'+w]?'oui':'non']); }); });
    exportCsv('lewys-mes-saisies-'+slug(state.me.name), rows);
  });
  $('expWeekJson').addEventListener('click', function(){ exportUserEntries(me); });
}
function exportUserEntries(uid){
  var out = {type:'lewys-saisies', user:uid, name:uname(uid), exportedAt:new Date().toISOString(), entries:{}, submissions:{}};
  Object.keys(state.data.entries).forEach(function(k){ if(k.split('|')[2]===uid) out.entries[k] = state.data.entries[k]; });
  Object.keys(state.data.submissions).forEach(function(k){ if(k.split('|')[0]===uid) out.submissions[k] = state.data.submissions[k]; });
  download('lewys-saisies-'+slug(uname(uid))+'-'+todayStr()+'.json', JSON.stringify(out,null,1), 'application/json');
  toast('Fichier de saisies téléchargé');
}

/* =====================================================================
   UTILISATEURS & PARAMÈTRES
   ===================================================================== */

  });

  html += '<div class="row" style="margin-top:12px"><label class="ctl"><input type="checkbox" id="costsOk" '+(S.costsConfirmed?'checked':'')+'> Coûts, capacités et compétences validés par les associés</label></div></div>';

  html += '<div class="card"><h3>Seuils de calcul</h3><div class="row" style="margin-top:10px;gap:18px">'+
    '<label class="ctl">Marge cible <input class="in" type="number" min="0" max="95" step="5" id="sTarget" value="'+Math.round(S.marginTarget*100)+'"> %</label>'+
    '<label class="ctl">Seuil « Lourd » (score ≥) <input class="in" type="number" min="1" step="0.5" id="sHeavy" value="'+S.heavy+'"></label>'+
    '<label class="ctl">Seuil « Moyen » (score ≥) <input class="in" type="number" min="1" step="0.5" id="sMed" value="'+S.medium+'"></label>'+
    '<label class="ctl">Note « haute » (quadrant) <input class="in" type="number" min="1" max="5" step="0.5" id="sHigh" value="'+S.high+'"></label>'+
    '<label class="ctl">Majoration onboarding <input class="in" type="number" min="0" max="100" step="5" id="sBoost" value="'+Math.round(S.onboardingBoost*100)+'"> %</label>'+
    '</div><p class="muted small" style="margin:8px 0 0">Mêmes règles que l’onglet « Paramètres » de la matrice Excel : score = Yield + Relation + Technique (×1,2 en onboarding).</p></div>';

  html += '<div class="card"><h3>Données</h3><div class="row" style="margin-top:10px">'+
    '<button class="btn" id="expJson">Sauvegarde complète (JSON)</button>'+
    '<label class="btn">Restaurer une sauvegarde<input type="file" id="impJson" accept=".json,application/json" class="hidden"></label>'+
    '<label class="btn">Importer les saisies d’un RM<input type="file" id="impUser" accept=".json,application/json" class="hidden"></label>'+
    '<button class="btn" id="expCsv">Exporter toutes les saisies (CSV)</button>'+
    '<span class="spacer"></span>'+(state.demo?'<button class="btn" data-act="exit-demo">Quitter la démo</button>':'<button class="btn gold" data-act="demo">Mode démo</button>')+
    '<button class="btn danger" id="resetAll">'+(state.confirmArmed==='resetall'?'Cliquer à nouveau pour tout effacer':'Réinitialiser')+'</button></div>'+
    '<p class="muted small" id="impMsg" style="margin:10px 0 0">Stockage actuel : '+(adapter===localAdapter?'<b>navigateur de ce poste</b> (localStorage). Tant que l’application n’est pas hébergée sur un serveur, chaque RM peut transmettre ses saisies via « Envoyer mes saisies (fichier) » et vous les importez ici.':'serveur (adaptateur externe).')+'</p></div>';

  html += '<div class="card"><details><summary class="strong">Mise en ligne (note technique)</summary>'+
    '<p class="small" style="margin:10px 0 6px">Le fichier est autonome. Pour un usage partagé (chaque RM saisit depuis son poste), héberger la page et brancher un stockage serveur en définissant, avant le script :</p>'+
    '<pre class="small" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto">'+esc("window.LEWYS_STORE_ADAPTER = {\n  load: async () => fetch('/api/pilotage').then(r => r.ok ? r.json() : null),\n  save: async (data) => fetch('/api/pilotage', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)})\n};")+'</pre>'+
    '<p class="small muted" style="margin:6px 0 0">Important : la connexion par identifiant / mot de passe est gérée dans le navigateur (mots de passe hachés SHA-256 salés). Elle cloisonne l’usage au quotidien mais ne remplace pas une authentification serveur : lors de la mise en ligne, contrôler les droits côté serveur (les RM ne doivent pas recevoir les montants des contrats).</p></details></div>';
  el.innerHTML = html;

  el.querySelectorAll('tr[data-u] [data-f]').forEach(function(inp){
    inp.addEventListener(inp.type==='checkbox'?'change':'input', function(){

        u[f] = inp.checked;
      }
      else if(f==='cost'||f==='capacity'){ var v=num(inp.value); u[f] = v!=null && v>=0 ? v : 0; }
      else if(f==='login'){ var lg = inp.value.trim().toLowerCase(); if(!lg || state.data.users.some(function(x){return x!==u && x.login.toLowerCase()===lg;})){ inp.style.borderColor='var(--crit)'; return; } inp.style.borderColor=''; u.login = lg; }
      else u[f] = inp.value;
      persist();
    });
  });
  el.querySelectorAll('[data-sk]').forEach(function(inp){ inp.addEventListener('input', function(){ var u = user(inp.closest('tr').getAttribute('data-u')); var v = num(inp.value); if(v==null) return; u.skills[inp.getAttribute('data-sk')] = Math.max(1,Math.min(5,v)); persist(); }); });
  el.querySelectorAll('[data-reset]').forEach(function(b){ b.addEventListener('click', function(){
    var id = b.getAttribute('data-reset');
    if(state.confirmArmed !== 'reset:'+id){ state.confirmArmed = 'reset:'+id; renderParams(); return; }
    state.confirmArmed=null; var u = user(id); u.salt = newSalt(); u.pwd = hashPwd(u.salt, DEFAULT_PWD); u.mustChange = true; persist(true); toast('Mot de passe de '+u.name+' réinitialisé'); renderParams();
  }); });
  $('addUser').addEventListener('click', function(){
    var id = 'u'+Date.now().toString(36); var salt = newSalt(); var base='nouveau', lg=base, i=1; while(state.data.users.some(function(x){return x.login===lg;})) lg = base+(++i);
    state.data.users.push({id:id,name:'Nouvel utilisateur',login:lg,role:'Revenue manager',isAdmin:false,cost:25,capacity:30,skills:{y:3,r:3,t:3},active:true,salt:salt,pwd:hashPwd(salt,DEFAULT_PWD),mustChange:true});
    persist(true); renderParams();
  });
  $('costsOk').addEventListener('change', function(){ S.costsConfirmed = this.checked; persist(true); renderBanners(); });
  var bindNum = function(id, fn){ $(id).addEventListener('input', function(){ var v = num(this.value); if(v!=null && v>=0){ fn(v); persist(); } }); };
  bindNum('sTarget', function(v){ if(v<100) S.marginTarget = v/100; });
  bindNum('sHeavy', function(v){ S.heavy = v; }); bindNum('sMed', function(v){ S.medium = v; }); bindNum('sHigh', function(v){ S.high = v; });
  bindNum('sBoost', function(v){ S.onboardingBoost = v/100; });
  $('expJson').addEventListener('click', function(){ download('lewys-pilotage-sauvegarde-'+todayStr()+'.json', JSON.stringify(state.data,null,1), 'application/json'); toast('Sauvegarde téléchargée'); });
  $('expCsv').addEventListener('click', function(){
    var rows = [['Semaine','Lundi','Mois','Hôtel','Groupe','RM','Heures','Tickets','Coût (€)','Commentaire','Validée']];
    Object.keys(state.data.entries).sort().forEach(function(k){ var q=k.split('|'), e=state.data.entries[k], h=hotel(q[1])||{name:q[1]}, u=user(q[2])||{name:q[2],cost:0};
      rows.push([q[0], weekMonday(q[0]).toISOString().slice(0,10), monthOfWeek(q[0]), h.name, h.group||'', u.name, e.h||0, e.tk||0, (e.h||0)*(u.cost||0), e.note||'', state.data.submissions[q[2]+'|'+q[0]]?'oui':'non']); });
    exportCsv('lewys-toutes-saisies', rows);
  });
  $('impJson').addEventListener('change', function(){ readJson(this, function(d){
    if(!d || !Array.isArray(d.hotels) || !Array.isArray(d.users)) throw new Error('format');
    state.data = normalize(d); state.demo=false; persist(true); var me = user(state.me.id); if(me) state.me = me; render(); $('impMsg').textContent = 'Sauvegarde restaurée : '+state.data.hotels.length+' hôtels, '+Object.keys(state.data.entries).length+' saisies.'; }); });
  $('impUser').addEventListener('change', function(){ readJson(this, function(d){
    if(!d || d.type!=='lewys-saisies' || !d.entries) throw new Error('format');
    var n=0; Object.keys(d.entries).forEach(function(k){ if(k.split('|')[2]===d.user){ state.data.entries[k] = d.entries[k]; n++; } });
    Object.keys(d.submissions||{}).forEach(function(k){ if(k.split('|')[0]===d.user) state.data.submissions[k] = d.submissions[k]; });
    persist(true); render(); $('impMsg').textContent = n+' saisies de '+(d.name||d.user)+' importées.'; }); });
  $('resetAll').addEventListener('click', function(){
    if(state.confirmArmed !== 'resetall'){ state.confirmArmed = 'resetall'; renderParams(); return; }
    state.confirmArmed = null; state.data = defaultData(); state.demo=false; persist(true); logout();
  });
}
function readJson(input, cb){
  var f = input.files && input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ try{ cb(JSON.parse(rd.result)); }catch(e){ $('impMsg').textContent = 'Fichier non reconnu : utilisez un export de cette application.'; } input.value=''; };
  rd.readAsText(f);
}

/* =====================================================================
   DÉMO (données fictives, jamais enregistrées)
   ===================================================================== */
function buildDemo(){
  var d = JSON.parse(JSON.stringify(state.data));
  d.entries = {}; d.submissions = {};
  var rnd = (function(seed){ return function(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }; })(7);
  d.hotels.forEach(function(h){
    var rooms = h.rooms || 30;
    if(!((h.fixe||0) + (h.varEstimate||0))){ h.fixe = Math.round((520 + rooms*11 + rnd()*320)/10)*10; if(rnd()>0.6){ h.varRate = 1.5; h.varEstimate = Math.round(rooms*9+rnd()*150); } }
  });
  var prof = {};
  d.hotels.forEach(function(h){
    var sc = ((+h.y||0)+(+h.r||0)+(+h.t||0)) * (h.phase==='Onboarding'?1.2:1);
    prof[h.id] = {base: 0.9 + sc*0.34 + rnd()*1.2, r:+h.r||2, t:+h.t||1};
  });
  if(prof.gingko) prof.gingko.base += 3.2;
  if(prof.lacoteoceane) prof.lacoteoceane.base += 2;
  if(prof.fleurdelune) prof.fleurdelune.base += 4.5;
  if(prof.premiereconciergerie) prof.premiereconciergerie.base = 1.9;
  if(prof.bwaurayleloch) prof.bwaurayleloch.base += 1.5;
  var cur = isoWeekKey(new Date());
  var weeks = lastWeeks(addWeeks(cur,-1), 58);
  var juniors = d.users.filter(function(u){return !u.isAdmin && u.active;}).map(function(u){return u.id;});
  weeks.forEach(function(w, wi){
    var season = 1 + 0.18*Math.sin((+w.split('-W')[1])/52*2*Math.PI - 1);
    d.hotels.forEach(function(h){
      var p = prof[h.id]; if(!p || !h.rm) return; if(rnd()<0.06) return;
      var tot = Math.round(p.base * season * (0.6 + rnd()*0.8) * 4)/4; if(tot<=0) return;
      var tk = Math.max(0, Math.round((p.r*0.9 + p.t*0.5) * (0.5 + rnd()) ));
      var uid = h.rm;
      var u = d.users.find(function(x){return x.id===uid;});
      if(u && u.isAdmin && juniors.length && rnd()<0.3){
        var share = Math.round(tot*0.4*4)/4; var j = juniors[Math.floor(rnd()*juniors.length)];
        if(share>0){ d.entries[w+'|'+h.id+'|'+j] = {h:share, tk:Math.round(tk*0.3), note:'', ts:''}; tot -= share; tk -= Math.round(tk*0.3); }
      }
      var note = (h.id==='gingko' && wi%5===1) ? 'Échanges tendus sur la grille, call avec la direction' : (h.id==='lacoteoceane' && wi%6===2) ? 'Désynchro RoomCloud / Chloé à corriger' : (h.id==='fleurdelune' && wi%4===0) ? 'Paramétrage yield dynamique, formation équipe' : '';
      d.entries[w+'|'+h.id+'|'+uid] = {h:tot, tk:tk, note:note, ts:''};
    });
    d.users.forEach(function(u){ if(wi === weeks.length-1 && u.id==='theophile') return; d.submissions[u.id+'|'+w] = new Date().toISOString(); });
  });
  d.settings.costsConfirmed = true;
  return d;
}

window.LewysPilotage = { getData:function(){ return state.data; }, setData:function(d){ state.data = normalize(d); persist(true); if(state.me) render(); } };

    state.data = normalize(d);
    if(!d) adapter.save(state.data);
    state.week = isoWeekKey(new Date());

    state.year = +state.month.slice(0,4);
    $('lgFoot').innerHTML = 'Accès réservé à l’équipe Lewys. Première connexion : utilisez le mot de passe provisoire transmis par votre administrateur, il vous sera demandé de le changer.';
    var sid = null; try{ sid = sessionStorage.getItem(SESSION_KEY); }catch(e){}
    var u = sid && user(sid);
    if(u && u.active) startSession(u); else $('lgUser').focus();
  });
}
var rsz; window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(function(){ if(state.me && ['dash','rentab'].indexOf(state.tab)>=0 && !$('overlay').innerHTML) render(); }, 250); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && $('overlay').querySelector('.drawer')){ closeDrawer(); if(state.me) render(); } });
init();
